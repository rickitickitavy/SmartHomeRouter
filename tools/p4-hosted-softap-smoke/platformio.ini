; Minimal SoftAP smoke test for ESP32-P4 + Hosted C6.
; Prefer validating SoftAP via env:esp32-p4-host. Building this nested project
; without the host custom_sdkconfig can reinstall stock Arduino libs and wipe
; the hybrid Hosted package used by esp32-p4-host.
[env:p4-hosted-softap-smoke]
platform = espressif32
board = esp32-p4
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = ../../partitions/host_s3_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
extra_scripts = pre:../../scripts/patch_p4_hosted_wifi_init_header.py
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM=1
