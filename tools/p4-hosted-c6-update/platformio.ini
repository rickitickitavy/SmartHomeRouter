; One-shot: push ESP-Hosted 2.12.11 to the P4 Wi-Fi co-processor over SDIO.
; Flash this, watch serial, then reflash normal esp32-p4-host firmware.
[env:p4-hosted-c6-update]
platform = espressif32
board = esp32-p4
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = ../../partitions/host_s3_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.embed_files =
	data/esp32c6-hosted.bin
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM=1
