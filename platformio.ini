; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-p4-host, esp32-c6-slave

[env]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32
monitor_speed = 921600

; ESP32-S3 host — pure ESP-IDF (scaffold: minimal app_main until product ports land).
[env:esp32-s3-host]
framework = espidf
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions/host_s3_16MB.csv
board_build.filesystem = littlefs
board_build.filesystem_partition = spiffs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/sdkconfig.host_idf_defaults
extra_scripts = pre:scripts/embed_web_assets_idf.py
build_flags =
	-DBOARD_ROLE_HOST=1
	-DBOARD_HOST_S3=1
	-DBOARD_HAS_PSRAM=1
; ESP-IDF ignores build_src_filter; sources are selected in src/CMakeLists.txt.
lib_deps =
lib_ignore =
	Zigbee

; ESP32-P4 host — pure ESP-IDF (scaffold: minimal app_main until product ports land).
; Hardware is rev v1.3 / ROM eco2 (esptool may still print "400MHz").
; Use ES board esp32-p4 (esp32p4_es / SELECTS_REV_LESS_V3). esp32-p4_r3 is rev>=3.0 and
; illegal-ops at bootloader entry on v1.3. Product schematic: no LAN/LCD/touch.
; Pin map in include/pins.h under BOARD_HOST_P4.
[env:esp32-p4-host]
framework = espidf
board = esp32-p4
board_build.partitions = partitions/host_p4_32MB.csv
board_build.filesystem = littlefs
board_build.filesystem_partition = spiffs
board_build.flash_mode = dio
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/sdkconfig.host_idf_defaults;${PROJECT_DIR}/sdkconfig.esp32-p4-host_idf_defaults
extra_scripts = pre:scripts/embed_web_assets_idf.py
build_flags =
	-DBOARD_ROLE_HOST=1
	-DBOARD_HOST_P4=1
	-DBOARD_HAS_PSRAM=1
; ESP-IDF ignores build_src_filter; sources are selected in src/CMakeLists.txt.
lib_deps =
lib_ignore =
	Zigbee

; ESP32-C6 slave — pure ESP-IDF (Zigbee ZCZR + SPI slave). Same cutover as hosts.
[env:esp32-c6-slave]
framework = espidf
board = esp32-c6-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/zigbee_zczr_16MB.csv
board_build.filesystem = littlefs
board_build.filesystem_partition = spiffs
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=${PROJECT_DIR}/sdkconfig.esp32-c6-slave_idf_defaults
build_flags =
	-DBOARD_ROLE_SLAVE=1
	-DZIGBEE_MODE_ZCZR=1
; ESP-IDF ignores build_src_filter; sources are selected in src/CMakeLists.txt.
lib_deps =

; Native Unity tests for HistoryStore page ring / overflow / outdated purge.
; Run: pio test -e native-history
[env:native-history]
platform = native
framework =
extra_scripts =
test_framework = unity
test_build_src = true
build_src_filter =
	+<HistoryStore.cpp>
build_flags =
	-std=gnu++17
	-DHISTORY_STORE_UNIT_TEST
	-DBOARD_ROLE_HOST=1
	-DBOARD_HOST_S3=1
	-I${PROJECT_DIR}/test/native_history/include
lib_extra_dirs = ${PROJECT_DIR}/test/native_history/lib
lib_deps =
	HistoryNativeStubs
test_filter = test_history_overflow
