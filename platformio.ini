; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-p4-host, esp32-c6-slave

[env]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/embed_web_assets.py
lib_deps = 
	knolleary/PubSubClient@2.8
	mlesniew/PicoMQTT@1.3.0
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer

[env:esp32-s3-host]
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions/host_s3_16MB.csv
board_build.filesystem_partition = spiffs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
custom_sdkconfig = 
	CONFIG_LWIP_MAX_ACTIVE_TCP=48
	CONFIG_LWIP_MAX_SOCKETS=48
	CONFIG_LWIP_MAX_LISTENING_TCP=48
	CONFIG_ESP_TASK_WDT_TIMEOUT_S=60
build_flags = 
	-DBOARD_ROLE_HOST=1
	-DBOARD_HOST_S3=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_LOOP_STACK_SIZE=16384
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	; ESP Mail Client: SMTP only (drop IMAP/SD FS hooks to shrink host RAM).
	-DDISABLE_IMAP
	-DDISABLE_SD
build_src_filter = 
	+<*>
	-<ZigbeeCoordinator.cpp>
lib_deps = 
	${env.lib_deps}
	mobizt/ESP Mail Client@3.4.24
lib_ignore = 
	Zigbee

; ESP32-P4 host. Hardware is rev v1.3 / ROM eco2 (esptool may still print "400MHz").
; Use ES board esp32-p4 (esp32p4_es / SELECTS_REV_LESS_V3). esp32-p4_r3 is rev>=3.0 and
; illegal-ops at bootloader entry on v1.3. Product schematic: no LAN/LCD/touch.
; Pin map in include/pins.h under BOARD_HOST_P4. Keep ASYNC_TCP on CPU0 like S3 (smtp-send).
[env:esp32-p4-host]
board = esp32-p4
board_build.partitions = partitions/host_p4_32MB.csv
board_build.filesystem_partition = spiffs
; dio: esp32p4_es qio_qspi sdkconfig targets rev>=301 and breaks ES v1.3 builds.
board_build.flash_mode = dio
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
; Keep Arduino wifi_init_config_t aligned with hybrid-built esp_hosted (wifi_task_stack_size).
extra_scripts = pre:scripts/patch_p4_hosted_wifi_init_header.py

custom_sdkconfig =
	CONFIG_LWIP_MAX_ACTIVE_TCP=48
	CONFIG_LWIP_MAX_SOCKETS=48
	CONFIG_LWIP_MAX_LISTENING_TCP=48
	CONFIG_ESP_TASK_WDT_TIMEOUT_S=60
	; Hosted SDIO queues: smaller = less INTERNAL DMA RAM (~+54 KiB vs Q=20).
	CONFIG_ESP_HOSTED_SDIO_TX_Q_SIZE=8
	CONFIG_ESP_HOSTED_SDIO_RX_Q_SIZE=8
	CONFIG_ESP_SDIO_TX_Q_SIZE=8
	CONFIG_ESP_SDIO_RX_Q_SIZE=8
	; More INTERNAL heap: L2 cache 256→128 KiB (needs hybrid IDF lib rebuild).
	CONFIG_CACHE_L2_CACHE_128KB=y
	'# CONFIG_CACHE_L2_CACHE_256KB is not set'
	CONFIG_CACHE_L2_CACHE_SIZE=0x20000
build_flags =
	-DBOARD_ROLE_HOST=1
	-DBOARD_HOST_P4=1
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_LOOP_STACK_SIZE=16384
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-DDISABLE_IMAP
	-DDISABLE_SD
build_src_filter =
	+<*>
	-<ZigbeeCoordinator.cpp>
lib_deps =
	${env.lib_deps}
	mobizt/ESP Mail Client@3.4.24
lib_ignore =
	Zigbee

[env:esp32-c6-slave]
board = esp32-c6-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/zigbee_zczr_16MB.csv
board_build.filesystem_partition = spiffs
build_src_filter = 
	+<*>
	-<EmailSender.cpp>
	-<HistoryStore.cpp>
build_flags = 
	-DBOARD_ROLE_SLAVE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DZIGBEE_MODE_ZCZR
	-DCORE_DEBUG_LEVEL=3
	-Wl,-lesp_zb_api.zczr
	-Wl,-lzboss_stack.zczr
	-Wl,-lzboss_port.native

; Native Unity tests for HistoryStore page ring / overflow / outdated purge.
; Run: pio test -e native-history
[env:native-history]
platform = native
framework =
extra_scripts =
test_framework = unity
test_build_src = true
build_src_filter =
	+<HistoryStore.cpp>
build_flags =
	-std=gnu++17
	-DHISTORY_STORE_UNIT_TEST
	-DBOARD_ROLE_HOST=1
	-DBOARD_HOST_S3=1
	-I${PROJECT_DIR}/test/native_history/include
lib_extra_dirs = ${PROJECT_DIR}/test/native_history/lib
lib_deps =
	HistoryNativeStubs
test_filter = test_history_overflow

