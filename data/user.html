            });
            window.addEventListener("online", function () {
                noteConnectionHttpOk(true);
            });
            window.addEventListener("offline", function () {
                noteConnectionHttpOk(false);
            });
            checkSession();
        };
    </script>
</head>
<body>
<div id="loginOverlay" class="login-overlay">
    <form id="loginForm" class="login-panel" autocomplete="on">
        <h1 class="section-title">Sign in</h1>
        <p id="loginError" class="save-error" hidden></p>
        <div class="field">
            <label for="loginUserName">User name</label>
            <input id="loginUserName" type="text" autocomplete="username">
        </div>
        <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password">
        </div>
        <label class="field-check">
            <input id="loginRememberMe" type="checkbox">
            Remember me
        </label>
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
</div>
<div id="connectionOverlay" class="connection-overlay" hidden>
    <div class="connection-overlay-panel" role="dialog" aria-modal="true" aria-labelledby="connectionOverlayTitle">
        <div id="connectionOverlayIcon" class="connection-overlay-icon" aria-hidden="true"></div>
        <h2 id="connectionOverlayTitle" class="connection-overlay-title">Disconnected</h2>
        <p id="connectionOverlayText" class="connection-overlay-text"></p>
    </div>
</div>
<div id="userShell" class="user-console-shell" hidden>
    <div class="user-console-toolbar">
        <div id="consoleTabs" class="tabs user-console-tabs" hidden></div>
    </div>
    <div id="consolePanels" class="user-console-panels" hidden></div>
    <p id="emptyState" class="field-hint user-console-empty" hidden>No consoles are assigned to your account.</p>
</div>
<div id="signOutConfirmDialog" class="dialog-overlay dialog-overlay-front" hidden>
    <div class="dialog-panel" role="dialog" aria-label="Sign out">
        <h3 class="upload-title">Sign out</h3>
        <p class="field-hint">Sign out of the control page?</p>
        <div class="dialog-actions">
            <button type="button" class="btn btn-primary" onclick="signOut()">Sign out</button>
            <button type="button" class="btn btn-secondary" onclick="closeSignOutConfirm()">Cancel</button>
        </div>
    </div>
</div>

    <div id="historyChartOverlay" class="dialog-overlay dialog-overlay-front" hidden>
        <div class="dialog-panel" role="dialog" aria-label="History">
            <h2 id="historyChartTitle">History</h2>
            <div class="history-chart-toolbar">
                <div class="history-chart-toolbar-top">
                    <div class="history-chart-presets" role="group" aria-label="Time range">
                        <button type="button" class="btn btn-secondary" data-history-hours="1" onclick="setHistoryChartPreset(1)">1h</button>
                        <button type="button" class="btn btn-secondary" data-history-hours="2" onclick="setHistoryChartPreset(2)">2h</button>
                        <button type="button" class="btn btn-secondary" data-history-hours="4" onclick="setHistoryChartPreset(4)">4h</button>
                        <button type="button" class="btn btn-secondary" data-history-hours="6" onclick="setHistoryChartPreset(6)">6h</button>
                        <button type="button" class="btn btn-secondary" data-history-hours="12" onclick="setHistoryChartPreset(12)">12h</button>
                        <button type="button" class="btn btn-secondary is-active" data-history-hours="24" onclick="setHistoryChartPreset(24)">24h</button>
                        <button type="button" class="btn btn-secondary" data-history-hours="48" onclick="setHistoryChartPreset(48)">2d</button>
                        <button type="button" class="btn btn-secondary" data-history-hours="168" onclick="setHistoryChartPreset(168)">7d</button>
                    </div>
                    <div id="historyChartSmoothControls" class="history-chart-smooth">
                        <div class="field-check">
                            <input id="historyChartSmooth" type="checkbox" onchange="onHistoryChartSmoothChange()">
                            <span>Smooth</span>
                        </div>
                        <label for="historyChartSmoothWindow">samples</label>
                        <input id="historyChartSmoothWindow" type="number" min="1" max="128" step="1" value="5"
                               onchange="onHistoryChartSmoothChange()" oninput="onHistoryChartSmoothWindowInput()">
                    </div>
                </div>
                <div class="history-chart-range">
                    <button type="button" class="btn btn-secondary" onclick="shiftHistoryChartRange(-1)" title="Previous period">◀</button>
                    <input id="historyChartStart" type="datetime-local" aria-label="Range start" onchange="applyHistoryChartDatetimeRange()">
                    <span aria-hidden="true">–</span>
                    <input id="historyChartEnd" type="datetime-local" aria-label="Range end" onchange="applyHistoryChartDatetimeRange()">
                    <button type="button" class="btn btn-secondary" onclick="shiftHistoryChartRange(1)" title="Next period">▶</button>
                </div>
            </div>
            <div id="historyChartCanvasWrap" class="history-chart-canvas-wrap">
                <canvas id="historyChartCanvas" width="680" height="320"
                        onmousemove="onHistoryChartPointer(event)"
                        onmouseleave="document.getElementById('historyChartTooltip').hidden = true"></canvas>
                <div id="historyChartTooltip" class="history-chart-tooltip" hidden></div>
            </div>
            <div id="historyChartLegend" class="history-chart-legend"></div>
            <div class="dialog-actions">
                <button type="button" class="btn btn-secondary" onclick="closeHistoryChart()">Close</button>
            </div>
        </div>
    </div>
</body>
</html>
