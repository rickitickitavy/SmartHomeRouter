<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control consoles</title>
    <link rel="stylesheet" type="text/css" href="css/all.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"/>
    <script>
        var signedInUser = null;
        var sessionWatchTimer = null;
        var firmwareRebootWaitActive = false;
        var nativeFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            return nativeFetch(input, init).then(function (response) {
                if (response.status === 401 && signedInUser && !firmwareRebootWaitActive) {
                    showLoginForm();
                }
                return response;
            });
        };

        var assignedConsoles = [];
        var activeConsoleIndex = 0;
        var showingAccountTab = false;
        var registeredDeviceRows = [];
        var automationStatusByName = {};
        var LIVE_WS_PING_MS = 15000;
        var LIVE_WS_PONG_MS = 5000;

        function createLiveSocketLiveness(isWanted) {
            var pingTimer = null;
            var pongTimer = null;
            var awaitingPong = false;
            var activeSocket = null;

            function clearTimers() {
                if (pingTimer != null) {
                    window.clearInterval(pingTimer);
                    pingTimer = null;
                }
                if (pongTimer != null) {
                    window.clearTimeout(pongTimer);
                    pongTimer = null;
                }
                awaitingPong = false;
            }

            return {
                bind: function (socket) {
                    clearTimers();
                    activeSocket = socket;
                    pingTimer = window.setInterval(function () {
                        if (!isWanted()) {
                            return;
                        }
                        if (activeSocket !== socket || socket.readyState !== WebSocket.OPEN) {
                            return;
                        }
                        if (awaitingPong) {
                            if (document.hidden) {
                                return;
                            }
                            try {
                                socket.close();
                            } catch (closeError) {
                            }
                            return;
                        }
                        awaitingPong = true;
                        try {
                            socket.send("{\"op\":\"ping\"}");
                        } catch (sendError) {
                            try {
                                socket.close();
                            } catch (closeError) {
                            }
                            return;
                        }
                        pongTimer = window.setTimeout(function () {
                            if (document.hidden) {
                                return;
                            }
                            if (awaitingPong && activeSocket === socket) {
                                try {
                                    socket.close();
                                } catch (closeError) {
                                }
                            }
                        }, LIVE_WS_PONG_MS);
                    }, LIVE_WS_PING_MS);
                },
                notePong: function () {
                    awaitingPong = false;
                    if (pongTimer != null) {
                        window.clearTimeout(pongTimer);
                        pongTimer = null;
                    }
                },
                stop: function () {
                    clearTimers();
                    activeSocket = null;
                }
            };
        }

        var devicesLiveWanted = false;
        var devicesLiveSocket = null;
        var devicesLiveReconnectTimer = null;
        var devicesLiveLiveness = createLiveSocketLiveness(function () {
            return devicesLiveWanted && !firmwareRebootWaitActive;
        });
        var consolesLiveWanted = false;
        var consolesLiveSocket = null;
        var consolesLiveReconnectTimer = null;
        var consolesLiveLiveness = createLiveSocketLiveness(function () {
            return consolesLiveWanted && !firmwareRebootWaitActive;
        });

        function normalizeThemeId(themeId) {
            return themeId === "dark" ? "dark" : "light";
        }

        function applyThemeToDocument(themeId) {
            document.documentElement.setAttribute("data-theme", normalizeThemeId(themeId));
        }

        function isOperatorUser(user) {
            if (!user) {
                return false;
            }
            if (user.isAdmin) {
                return true;
            }
            return !!(user.editDevices || user.addDevices || user.removeDevices || user.editUsers
                || user.editConsoles || user.monitor);
        }

        function showLoginForm() {
            signedInUser = null;
            stopSessionWatch();
            stopDevicesLive();
            stopConsolesLive();
            applyThemeToDocument("dark");
            document.getElementById("userShell").hidden = true;
            document.getElementById("loginOverlay").hidden = false;
            focusLoginDefaultField();
        }

        function focusLoginDefaultField() {
            var userNameInput = document.getElementById("loginUserName");
            var passwordInput = document.getElementById("loginPassword");
            window.setTimeout(function () {
                if (userNameInput && !String(userNameInput.value || "").trim()) {
                    userNameInput.focus();
                    return;
                }
                if (passwordInput) {
                    passwordInput.focus();
                }
            }, 0);
        }

        function stopSessionWatch() {
            if (sessionWatchTimer != null) {
                window.clearInterval(sessionWatchTimer);
                sessionWatchTimer = null;
            }
        }

        function startSessionWatch() {
            if (sessionWatchTimer != null) {
                return;
            }
            sessionWatchTimer = window.setInterval(function () {
                if (!signedInUser || firmwareRebootWaitActive) {
                    return;
                }
                fetch("/api/auth/me", { cache: "no-store" }).catch(function () {
                });
            }, 10000);
        }

        function enterUserConsole(user) {
            if (isOperatorUser(user)) {
                window.location.href = "/";
                return;
            }
            signedInUser = user;
            document.getElementById("loginOverlay").hidden = true;
            document.getElementById("userShell").hidden = false;
            applyThemeToDocument(user && user.theme);
            startSessionWatch();
            loadUserConsoles();
            startDevicesLive();
            startConsolesLive();
        }

        function checkSession() {
            fetch("/api/auth/me", { cache: "no-store" }).then(function (response) {
                if (response.status === 401) {
                    showLoginForm();
                    return null;
                }
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                return response.json();
            }).then(function (user) {
                if (user) {
                    enterUserConsole(user);
                }
            }).catch(function () {
                showLoginForm();
            });
        }

        function submitLogin() {
            var errorLine = document.getElementById("loginError");
            if (errorLine) {
                errorLine.hidden = true;
            }
            var userNameInput = document.getElementById("loginUserName");
            var passwordInput = document.getElementById("loginPassword");
            var rememberInput = document.getElementById("loginRememberMe");
            fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userName: userNameInput ? userNameInput.value : "",
                    password: passwordInput ? passwordInput.value : "",
                    rememberMe: !!(rememberInput && rememberInput.checked)
                })
            }).then(function (response) {
                return response.text().then(function (text) {
                    if (!response.ok) {
                        throw new Error(text || ("HTTP " + response.status));
                    }
                });
            }).then(function () {
                if (passwordInput) {
                    passwordInput.value = "";
                }
                checkSession();
            }).catch(function (error) {
                if (errorLine) {
                    errorLine.hidden = false;
                    errorLine.textContent = error && error.message ? error.message : "Sign in failed";
                }
            });
        }

        function signOut() {
            document.getElementById("signOutConfirmDialog").hidden = true;
            fetch("/api/auth/logout", { method: "POST" }).finally(function () {
                showLoginForm();
            });
        }

        function openSignOutConfirm() {
            document.getElementById("signOutConfirmDialog").hidden = false;
        }

        function closeSignOutConfirm() {
            document.getElementById("signOutConfirmDialog").hidden = true;
        }

        function loadUserConsoles() {
            Promise.all([
                fetch("/api/consoles/mine", { cache: "no-store" }).then(function (response) {
                    return response.text().then(function (text) {
                        if (!response.ok) {
                            throw new Error(text || ("HTTP " + response.status));
                        }
                        return JSON.parse(text || "[]");
                    });
                }),
                loadAutomationStatuses()
            ]).then(function (parts) {
                assignedConsoles = Array.isArray(parts[0]) ? parts[0] : [];
                if (activeConsoleIndex >= assignedConsoles.length) {
                    activeConsoleIndex = 0;
                }
                renderConsoleTabs();
            }).catch(function () {
                assignedConsoles = [];
                renderConsoleTabs();
            });
        }

        function selectConsoleTab(index) {
            showingAccountTab = false;
            activeConsoleIndex = index;
            renderConsoleTabs();
        }

        function selectAccountTab() {
            showingAccountTab = true;
            renderConsoleTabs();
        }

        function fillUserAccountPanel(panelsHost) {
            var userLabel = (signedInUser && (signedInUser.userName || signedInUser.name)) || "Account";
            panelsHost.innerHTML = "";
            var panel = document.createElement("div");
            panel.className = "tab-content user-console-tab";
            var title = document.createElement("h2");
            title.className = "section-title";
            title.textContent = userLabel;
            panel.appendChild(title);
            var err = document.createElement("p");
            err.className = "save-error";
            err.id = "userThemeSaveError";
            err.hidden = true;
            panel.appendChild(err);
            var field = document.createElement("div");
            field.className = "field";
            var label = document.createElement("label");
            label.setAttribute("for", "userUiTheme");
            label.textContent = "Theme";
            field.appendChild(label);
            var row = document.createElement("div");
            row.className = "theme-control-row";
            var select = document.createElement("select");
            select.id = "userUiTheme";
            [["light", "Light"], ["dark", "Dark"]].forEach(function (pair) {
                var option = document.createElement("option");
                option.value = pair[0];
                option.textContent = pair[1];
                select.appendChild(option);
            });
            select.value = normalizeThemeId(signedInUser && signedInUser.theme);
            select.onchange = function () {
                applyThemeToDocument(select.value);
            };
            var saveBtn = document.createElement("button");
            saveBtn.type = "button";
            saveBtn.className = "btn btn-primary";
            saveBtn.textContent = "Save";
            saveBtn.onclick = function () {
                var themeId = normalizeThemeId(select.value);
                applyThemeToDocument(themeId);
                fetch("/api/theme", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ theme: themeId })
                }).then(function (response) {
                    if (!response.ok) {
                        throw new Error("theme save failed");
                    }
                    if (signedInUser) {
                        signedInUser.theme = themeId;
                    }
                    err.hidden = true;
                }).catch(function () {
                    err.hidden = false;
                    err.textContent = "Could not save theme";
                });
            };
            row.appendChild(select);
            row.appendChild(saveBtn);
            field.appendChild(row);
            panel.appendChild(field);
            var signOutWrap = document.createElement("div");
            signOutWrap.className = "field";
            signOutWrap.style.marginTop = "1rem";
            var signOutBtn = document.createElement("button");
            signOutBtn.type = "button";
            signOutBtn.className = "btn btn-secondary";
            signOutBtn.textContent = "Sign out";
            signOutBtn.onclick = openSignOutConfirm;
            signOutWrap.appendChild(signOutBtn);
            panel.appendChild(signOutWrap);
            panelsHost.appendChild(panel);
            panelsHost.hidden = false;
        }

        function appendUserConsoleAccountTab(tabsHost) {
            var userLabel = (signedInUser && (signedInUser.userName || signedInUser.name)) || "Account";
            var accountButton = document.createElement("button");
            accountButton.type = "button";
            accountButton.className = "tab-btn user-console-signout-tab"
                + (showingAccountTab ? " active" : "");
            accountButton.textContent = userLabel;
            accountButton.onclick = function () {
                selectAccountTab();
            };
            tabsHost.appendChild(accountButton);
        }

        function renderConsoleTabs() {
            var tabsHost = document.getElementById("consoleTabs");
            var panelsHost = document.getElementById("consolePanels");
            var emptyState = document.getElementById("emptyState");
            if (!tabsHost || !panelsHost) {
                return;
            }
            tabsHost.innerHTML = "";
            panelsHost.innerHTML = "";
            tabsHost.hidden = false;
            var tabIndex;
            for (tabIndex = 0; tabIndex < assignedConsoles.length; tabIndex++) {
                var tabButton = document.createElement("button");
                tabButton.type = "button";
                tabButton.className = "tab-btn"
                    + ((!showingAccountTab && tabIndex === activeConsoleIndex) ? " active" : "");
                tabButton.textContent = assignedConsoles[tabIndex].name || "Console";
                tabButton.onclick = (function (storedIndex) {
                    return function () {
                        selectConsoleTab(storedIndex);
                    };
                })(tabIndex);
                tabsHost.appendChild(tabButton);
            }
            appendUserConsoleAccountTab(tabsHost);
            if (showingAccountTab) {
                if (emptyState) {
                    emptyState.hidden = true;
                }
                fillUserAccountPanel(panelsHost);
                return;
            }
            if (!assignedConsoles.length) {
                panelsHost.hidden = true;
                if (emptyState) {
                    emptyState.hidden = false;
                }
                return;
            }
            panelsHost.hidden = false;
            if (emptyState) {
                emptyState.hidden = true;
            }
            var panel = document.createElement("div");
            panel.className = "tab-content user-console-tab";
            renderConsoleGrid(panel, assignedConsoles[activeConsoleIndex]);
            panelsHost.appendChild(panel);
        }

        function loadAutomationStatuses() {
            return fetch("/api/automations", { cache: "no-store" }).then(function (response) {
                if (!response.ok) {
                    throw new Error("automations unavailable");
                }
                return response.json();
            }).then(function (rows) {
                var map = {};
                var list = Array.isArray(rows) ? rows : [];
                var index;
                for (index = 0; index < list.length; index++) {
                    if (list[index] && list[index].name) {
                        map[list[index].name] = {
                            active: !!list[index].active,
                            timerUse: !!(list[index].timer && list[index].timer.use)
                        };
                    }
                }
                automationStatusByName = map;
            }).catch(function () {
                automationStatusByName = {};
            });
        }

        function normalizeAutomationControl(value) {
            var text = String(value || "");
            if (text === "run" || text === "startTimer" || text === "stopTimer" || text === "restartTimer") {
                return text;
            }
            return "enableDisable";
        }

        function automationIsActive(name) {
            var entry = automationStatusByName[name];
            if (entry && typeof entry === "object") {
                return !!entry.active;
            }
            return !!entry;
        }

        function runAutomationControl(name, mode) {
            var op = "RUN";
            if (mode === "startTimer") {
                op = "START TIMER";
            } else if (mode === "stopTimer") {
                op = "STOP TIMER";
            } else if (mode === "restartTimer") {
                op = "RESTART TIMER";
            }
            return fetch("/api/consoles/run-action", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ target: "automation", name: name, op: op })
            }).then(function (response) {
                if (!response.ok) {
                    throw new Error("automation control failed");
                }
            });
        }

        function flashAutomationIcon(iconEl) {
            if (!iconEl) {
                return;
            }
            iconEl.classList.add("is-action-flash");
            window.setTimeout(function () {
                iconEl.classList.remove("is-action-flash");
            }, 600);
        }

        function setAutomationActive(name, active) {
            return fetch("/api/automations/active", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, active: !!active })
            }).then(function (response) {
                if (!response.ok) {
                    throw new Error("active update failed");
                }
                var prev = automationStatusByName[name];
                if (prev && typeof prev === "object") {
                    prev.active = !!active;
                } else {
                    automationStatusByName[name] = { active: !!active, timerUse: false };
                }
            });
        }

        function findRegisteredDevice(ieee) {
            var index;
            for (index = 0; index < registeredDeviceRows.length; index++) {
                if ((registeredDeviceRows[index].ieee || "") === (ieee || "")) {
                    return registeredDeviceRows[index];
                }
            }
            return null;
        }

        function statusEntriesForDevice(device) {
            var entries = [];
            var raw = device && device.status;
            if (!raw || !raw.length) {
                return entries;
            }
            var index;
            for (index = 0; index < raw.length; index++) {
                entries.push({
                    ep: raw[index].ep,
                    state: raw[index].state || "",
                    move: raw[index].move || "",
                    position: raw[index].position || ""
                });
            }
            entries.sort(function (left, right) {
                return (left.ep || 0) - (right.ep || 0);
            });
            return entries;
        }

        function findStatusEntry(entries, endpoint) {
            var index;
            for (index = 0; index < entries.length; index++) {
                if (entries[index].ep == endpoint) {
                    return entries[index];
                }
            }
            return null;
        }

        function findStatusState(entries, endpoint) {
            var entry = findStatusEntry(entries, endpoint);
            return entry ? (entry.state || "") : "";
        }

        function measurementStateForBinding(device, binding) {
            var entries = statusEntriesForDevice(device);
            var matched = findStatusState(entries, bindingChannel(binding));
            if (matched) {
                return matched;
            }
            var index;
            for (index = 0; index < entries.length; index++) {
                if (entries[index].state) {
                    return entries[index].state;
                }
            }
            return "";
        }

        function bindingParamId(binding) {
            return binding && binding.param ? String(binding.param) : "status";
        }

        function deviceBatteryText(device) {
            if (!device || device.battery === undefined || device.battery === null || device.battery === "") {
                return "";
            }
            return String(device.battery);
        }

        function splitUserDataBraceSlots(braceText) {
            var body = String(braceText || "").trim();
            if (body.charAt(0) === "{") {
                body = body.substring(1);
            }
            if (body.charAt(body.length - 1) === "}") {
                body = body.substring(0, body.length - 1);
            }
            var slots = [];
            var current = "";
            var inString = false;
            var escape = false;
            var index;
            for (index = 0; index < body.length; index++) {
                var character = body.charAt(index);
                if (inString) {
                    current += character;
                    if (escape) {
                        escape = false;
                        continue;
                    }
                    if (character === "\\") {
                        escape = true;
                        continue;
                    }
                    if (character === "\"") {
                        inString = false;
                    }
                    continue;
                }
                if (character === "\"") {
                    inString = true;
                    current += character;
                    continue;
                }
                if (character === ",") {
                    slots.push(current.trim());
                    current = "";
                    continue;
                }
                current += character;
            }
            slots.push(current.trim());
            return slots;
        }

        function userDataBraceStateText(device) {
            if (!device) {
                return "";
            }
            return measurementStateForBinding(device, { channel: 1 }) || "";
        }

        function userDataSlotDisplayToken(device, slotIndex) {
            var stateText = userDataBraceStateText(device);
            if (!stateText) {
                return "";
            }
            var braceText = stateText;
            var valAt = stateText.indexOf("val=");
            if (valAt >= 0) {
                braceText = stateText.substring(valAt + 4);
            }
            var slots = splitUserDataBraceSlots(braceText);
            if (slotIndex < 0 || slotIndex >= slots.length) {
                return "";
            }
            var token = slots[slotIndex];
            if (!token || token.toUpperCase() === "NULL") {
                return "";
            }
            if (token.charAt(0) === "\"" && token.charAt(token.length - 1) === "\"") {
                token = token.substring(1, token.length - 1);
            }
            var fields = Array.isArray(device.userDataFields) ? device.userDataFields : [];
            var fieldType = fields[slotIndex] && fields[slotIndex].type
                ? fields[slotIndex].type
                : "string";
            if (fieldType === "bool") {
                var lower = token.toLowerCase();
                if (lower === "true" || lower === "on") {
                    return "ON";
                }
                if (lower === "false" || lower === "off") {
                    return "OFF";
                }
            }
            return token;
        }

        function userDataFieldValueFromState(device, fieldName) {
            if (!device || !fieldName) {
                return "";
            }
            var fields = Array.isArray(device.userDataFields) ? device.userDataFields : [];
            var fieldIndex = -1;
            var index;
            for (index = 0; index < fields.length; index++) {
                if (fields[index] && String(fields[index].name || "").trim() === fieldName) {
                    fieldIndex = index;
                    break;
                }
            }
            if (fieldIndex < 0) {
                return "";
            }
            return userDataSlotDisplayToken(device, fieldIndex);
        }

        function bindingResolvedState(device, binding) {
            var param = bindingParamId(binding);
            if (param === "battery") {
                return deviceBatteryText(device);
            }
            if (param === "position") {
                var coveringEntry = findStatusEntry(
                    statusEntriesForDevice(device),
                    bindingChannel(binding)
                );
                if (coveringEntry && coveringEntry.position) {
                    return String(coveringEntry.position);
                }
            }
            if (device && device.type === "userData") {
                if (param === "custom") {
                    return userDataBraceStateText(device);
                }
                if (!param || param === "status") {
                    return userDataSlotDisplayToken(device, 0);
                }
                return userDataFieldValueFromState(device, param);
            }
            if (isMeasurementDeviceType(device && device.type ? device.type : "")) {
                return measurementStateForBinding(device, binding);
            }
            return findStatusState(statusEntriesForDevice(device), bindingChannel(binding));
        }

        function isMeasurementDeviceType(typeId) {
            return typeId == "illuminanceMeasurement"
                || typeId == "illuminanceLevelSensing"
                || typeId == "temperatureMeasurement"
                || typeId == "pressureMeasurement"
                || typeId == "flowMeasurement"
                || typeId == "relativeHumidity"
                || typeId == "metering"
                || typeId == "electricalMeasurement";
        }

        function isBinarySensorDeviceType(typeId) {
            return typeId == "binaryInput"
                || typeId == "binaryOutput"
                || typeId == "binaryValue"
                || typeId == "bacnetBinaryInputRegular"
                || typeId == "bacnetBinaryInputExtended"
                || typeId == "bacnetBinaryOutputRegular"
                || typeId == "bacnetBinaryOutputExtended"
                || typeId == "bacnetBinaryValueRegular"
                || typeId == "bacnetBinaryValueExtended";
        }

        function userDataFieldTypeForParam(device, paramValue) {
            if (!device || (device.type || "") !== "userData" || !paramValue) {
                return "";
            }
            var wanted = String(paramValue).trim();
            if (!wanted || wanted === "custom" || wanted === "battery" || wanted === "status") {
                return "";
            }
            var fields = Array.isArray(device.userDataFields) ? device.userDataFields : [];
            var fieldIndex;
            for (fieldIndex = 0; fieldIndex < fields.length; fieldIndex++) {
                var fieldName = fields[fieldIndex] && fields[fieldIndex].name
                    ? String(fields[fieldIndex].name).trim()
                    : "";
                if (fieldName === wanted) {
                    return String(fields[fieldIndex].type || "string");
                }
            }
            return "";
        }

        function normalizeMdiIconId(iconId) {
            var text = String(iconId || "").trim().toLowerCase();
            if (!text) {
                return "mdi:checkbox-marked-circle";
            }
            if (text.indexOf("mdi:") !== 0) {
                text = "mdi:" + text.replace(/^mdi-/, "");
            }
            return text;
        }

        function mdiIconClassName(iconId) {
            return normalizeMdiIconId(iconId).replace(":", "-");
        }

        function isBinaryStateOn(stateText) {
            var upper = String(stateText || "").trim().toUpperCase();
            return upper === "ON" || upper === "1" || upper === "TRUE";
        }

        function normalizeIconScale(value) {
            var scale = parseFloat(value);
            if (isNaN(scale) || scale <= 0) {
                return 1;
            }
            return scale;
        }

        function normalizeTitlePosition(value) {
            if (value === "right" || value === "top" || value === "bottom") {
                return value;
            }
            return "left";
        }

        function normalizeIconAlign(value) {
            if (value === "left" || value === "right") {
                return value;
            }
            return "center";
        }

        function normalizeAlignV(value) {
            if (value === "top" || value === "bottom") {
                return value;
            }
            return "center";
        }

        function normalizeFontScale(value) {
            return normalizeIconScale(value);
        }

        function spacerBindingText(binding) {
            if (!binding) {
                return "";
            }
            if (binding.text != null && binding.text !== undefined) {
                return String(binding.text);
            }
            return binding.title ? String(binding.title) : "";
        }

        function applySpacerCellLayout(row, binding) {
            if (!row || !binding) {
                return;
            }
            var text = spacerBindingText(binding).trim();
            row.classList.add(
                "console-device-row--spacer-align-h-" + normalizeIconAlign(binding.alignH)
            );
            row.classList.add(
                "console-device-row--spacer-align-v-" + normalizeAlignV(binding.alignV)
            );
            if (text) {

        function defaultMeasurementDecimals(typeId) {

        function formatMeasurementDisplay(typeId, stateText, unitId, decimals) {
            var value = parseNumericState(stateText);
            if (value === null) {
                return stateText ? String(stateText) : "—";
            }
            var unit = unitId || "";
            var places = decimals;
            if (places === undefined || places === null || places < 0) {
                places = defaultMeasurementDecimals(typeId);

            if (typeId == "temperatureMeasurement") {
                var celsius = value;
                if (unit === "F") {
                    return formatFixedValue(celsius * 9 / 5 + 32, places) + " °F";
                }
                if (unit === "K") {
                    return formatFixedValue(celsius + 273.15, places) + " K";
                }
                return formatFixedValue(celsius, places) + " °C";
            }
            if (typeId == "relativeHumidity") {
                return formatFixedValue(value, places) + (unit === "%" || !unit ? " %" : " " + unit);

            if (typeId == "pressureMeasurement") {
                // Devices table shows the scaled report as-is; only format decimals + unit label.

                if (pressureLabel === "hPa") {
                    return formatFixedValue(value, places) + " hPa";

                if (pressureLabel === "Pa") {
                    return formatFixedValue(value, places) + " Pa";
                }
                if (pressureLabel === "kPa") {
                    return formatFixedValue(value, places) + " kPa";
                }
                if (pressureLabel === "bar") {
                    return formatFixedValue(value, places) + " bar";
                }
                if (pressureLabel === "psi") {
                    return formatFixedValue(value, places) + " psi";
                }
                return formatFixedValue(value, places) + " " + pressureLabel;
            }
            if (typeId == "illuminanceMeasurement" || typeId == "illuminanceLevelSensing") {
                return formatFixedValue(value, places) + (unit === "lx" || !unit ? " lx" : " " + unit);
            }
            if (typeId == "flowMeasurement") {
                if (unit === "m3/h") {
                    return formatFixedValue(value, places) + " m³/h";
                }
                if (unit === "l/min") {
                    return formatFixedValue(value, places) + " L/min";
                }
                return formatFixedValue(value, places) + (unit ? " " + unit : "");
            }
            return formatFixedValue(value, places) + (unit ? " " + unit : "");
        }

        function coveringPositionText(state) {

        function consoleCmToPx(cmValue) {

        function makeDefaultCompositeCell() {

        function normalizeCompositeAlignV(value) {

        function applyCompositeCellAlignClasses(bodyEl, cell) {

        function applyCompositeLayoutSizes(root, widget) {
            if (!root || !widget) {
                return;
            }
            var isEdit = root.classList.contains("console-composite--edit");
            var rowNodes = root.querySelectorAll(".console-composite-row");
            var rows = widget.compositeRows || [];
            var rowIndex;
            for (rowIndex = 0; rowIndex < rowNodes.length && rowIndex < rows.length; rowIndex++) {
                var row = rows[rowIndex];
                var cells = row.cells || [];
                var rowEl = rowNodes[rowIndex];
                var cellsWrap = rowEl.querySelector(".console-composite-cells");
                var availableWidthPx = cellsWrap
                    ? (cellsWrap.clientWidth || cellsWrap.offsetWidth || 0)
                    : 0;
                if (!(availableWidthPx > 0)) {
                    availableWidthPx = root.clientWidth || root.offsetWidth || 0;
                }
                if (!(availableWidthPx > 0)) {
                    availableWidthPx = consoleCmToPx(10);
                }
                var sumCm = 0;
                var sumU = 0;
                var cellIndex;
                for (cellIndex = 0; cellIndex < cells.length; cellIndex++) {
                    var cell = cells[cellIndex];
                    var widthValue = Number(cell.width);
                    if (!(widthValue > 0)) {
                        widthValue = 1;

                if (bodyNodes.length) {

                            bodyNodes[cellIndex].style.height = "auto";
                        } else {
                            bodyNodes[cellIndex].style.height = String(specifiedHeightPx) + "px";
                            bodyNodes[cellIndex].style.minHeight = String(specifiedHeightPx) + "px";
                        }
                    }
                } else if (isEdit) {
                    rowNodes[rowIndex].style.minHeight = String(specifiedHeightPx) + "px";
                    rowNodes[rowIndex].style.height = "auto";
                } else {
                    rowNodes[rowIndex].style.height = String(specifiedHeightPx) + "px";
                }
                var finalWidths = [];
                var totalProp = 0;
                for (cellIndex = 0; cellIndex < cellCount; cellIndex++) {
                    var sizedCell = cells[cellIndex];
                    var sizedWidth = Number(sizedCell.width);

        function applyCompositeContentFit(root) {

            var TITLE_FONT_MAX = 15;
            var TITLE_FONT_MIN = 9;

            var VALUE_FONT_MIN = 10;
            var VALUE_FONT_MAX = 16;
            var VALUE_FONT_REF = 104;

            var TITLE_TO_VALUE_RATIO = 0.9;

            function measureBodyFit(bodyEl) {

                titleEl.style.maxWidth = String(maxWidthPx) + "px";
                titleEl.style.boxSizing = "border-box";
                titleEl.style.whiteSpace = "normal";
                titleEl.style.overflowWrap = "anywhere";
                titleEl.style.lineHeight = "1.15";
                titleEl.style.minHeight = "";

                titleEl.style.fontSize = String(fontPx) + "px";
                while (fontPx > TITLE_FONT_MIN
                    && (titleEl.scrollHeight > maxHeightPx + 0.5
                        || titleEl.scrollWidth > maxWidthPx + 0.5)) {
                    fontPx -= 0.5;
                    titleEl.style.fontSize = String(fontPx) + "px";
                }
                return Math.min(maxHeightPx, titleEl.offsetHeight || 0);
            }

            var rowNodes = root.querySelectorAll(".console-composite-row");
            var rowIndex;
            for (rowIndex = 0; rowIndex < rowNodes.length; rowIndex++) {
                var rowEl = rowNodes[rowIndex];
                var bodyNodes = rowEl.querySelectorAll(".console-composite-cell-body");
                var gaugeBodies = [];
                var bodyIndex;
                for (bodyIndex = 0; bodyIndex < bodyNodes.length; bodyIndex++) {
                    var bodyEl = bodyNodes[bodyIndex];
                    var fit = measureBodyFit(bodyEl);
                    bodyEl.style.setProperty("--composite-cell-w", String(fit.fitW) + "px");
                    bodyEl.style.setProperty("--composite-cell-h", String(fit.fitH) + "px");
                    if (bodyEl.querySelector(".console-gauge-arc-svg")) {

                    }
                    var icons = bodyEl.querySelectorAll(".console-binary-icon");
                    var iconIndex;
                    // Size under cell bounds; MDI glyphs can extend past the em box (e.g. mdi:engine).

                ? "OFF"
                : "ON";

        function bindingParamIsNumeric(device, paramValue) {
            if (!device || !paramValue) {
                return false;

            var typeId = device.type || "";
            if (paramValue === "onOff") {
                return false;
            }
            if (paramValue === "status") {
                return isMeasurementDeviceType(typeId);
            }
            if (paramValue === "battery"
                || paramValue === "custom"
                || paramValue === "sensorValue"
                || paramValue === "position"
                || paramValue === "lightLevel") {
                return true;
            }
            if (typeId === "userData") {
                var fieldType = userDataFieldTypeForParam(device, paramValue);
                return fieldType === "int" || fieldType === "float";
            }
            if (isMeasurementDeviceType(typeId)) {
                return true;
            }
            return false;
        }

            if (!device || !binding) {

            var param = bindingParamId(binding);
            var rawState = bindingResolvedState(device, binding);
            if (isMeasurementDeviceType(typeId) && param !== "battery") {
                return measurementNumericValue(typeId, rawState, binding.unit);
            }
            return parseBindingNumericValue(rawState);

        function buildConsoleGaugeElement(binding, numericValue, displayText) {
            var gauge = binding && binding.gauge ? binding.gauge : {};
            var minValue = gauge.min != null ? Number(gauge.min) : 0;
            var maxValue = gauge.max != null ? Number(gauge.max) : 100;
            if (!(maxValue > minValue)) {
                maxValue = minValue + 1;
            }
            var clamped = numericValue;
            if (isNaN(clamped)) {
                clamped = minValue;
            } else if (clamped < minValue) {
                clamped = minValue;
            } else if (clamped > maxValue) {
                clamped = maxValue;
            }
            var ratio = (clamped - minValue) / (maxValue - minValue);
            var ranges = Array.isArray(gauge.ranges) ? gauge.ranges.slice() : [];
            ranges.sort(function (left, right) {
                return Number(left.top) - Number(right.top);
            });
            var wrap = document.createElement("div");
            wrap.className = "console-gauge console-gauge--" + (gauge.type === "linear" ? "linear" : "arc");
            if (gauge.type === "linear") {
                var track = document.createElement("div");
                track.className = "console-gauge-linear-track";
                var fill = document.createElement("div");
                fill.className = "console-gauge-linear-fill";
                fill.style.width = String(Math.round(ratio * 1000) / 10) + "%";
                var fillColor = "#3b82f6";
                var rangeIndex;
                for (rangeIndex = 0; rangeIndex < ranges.length; rangeIndex++) {
                    if (clamped <= Number(ranges[rangeIndex].top)) {
                        fillColor = ranges[rangeIndex].color || fillColor;
                        break;
                    }
                }
                fill.style.background = fillColor;
                track.appendChild(fill);
                wrap.appendChild(track);
            } else {
                // Home Assistant ha-gauge geometry: origin center, upper semicircle, sweep=1.
                var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute("viewBox", "-52 -52 104 58");
                svg.setAttribute("class", "console-gauge-arc-svg");
                var arcRadius = 40;
                var arcStroke = 14;
                // Needle sits on the band: tip ~1mm past outer edge, base ~6mm inside inner edge.
                var needleTipRadius = arcRadius + arcStroke / 2 + 2;
                var needleBaseRadius = arcRadius - arcStroke / 2 - 10;
                function gaugeAngleDeg(value) {
                    var pct = (value - minValue) / (maxValue - minValue);
                    if (pct < 0) {
                        pct = 0;
                    }
                    if (pct > 1) {
                        pct = 1;
                    }
                    return pct * 180;
                }
                function gaugePolar(angleDeg) {
                    var angleRad = (angleDeg * Math.PI) / 180;
                    return {
                        x: -arcRadius * Math.cos(angleRad),
                        y: -arcRadius * Math.sin(angleRad)
                    };
                }
                function appendGaugeArc(fromDeg, toDeg, color, width) {
                    if (!(toDeg > fromDeg + 0.01)) {
                        return;
                    }
                    var fromPoint = gaugePolar(fromDeg);
                    var toPoint = gaugePolar(toDeg);
                    var largeArc = toDeg - fromDeg > 180 ? 1 : 0;
                    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute(
                        "d",
                        "M " + fromPoint.x + " " + fromPoint.y
                            + " A " + arcRadius + " " + arcRadius + " 0 " + largeArc + " 1 "
                            + toPoint.x + " " + toPoint.y
                    );
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke", color);
                    path.setAttribute("stroke-width", String(width || arcStroke));
                    path.setAttribute("stroke-linecap", "butt");
                    svg.appendChild(path);
                }
                appendGaugeArc(0, 180, "#334155", arcStroke);
                var previous = minValue;
                var colorIndex;
                for (colorIndex = 0; colorIndex < ranges.length; colorIndex++) {
                    var top = Number(ranges[colorIndex].top);
                    if (!(top > previous)) {
                        continue;
                    }
                    appendGaugeArc(
                        gaugeAngleDeg(previous),
                        gaugeAngleDeg(Math.min(top, maxValue)),
                        ranges[colorIndex].color || "#3b82f6",
                        arcStroke
                    );
                    previous = top;
                }
                if (!ranges.length) {
                    appendGaugeArc(0, gaugeAngleDeg(clamped), "#3b82f6", arcStroke);
                }
                var needleGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
                needleGroup.setAttribute(
                    "transform",
                    "rotate(" + gaugeAngleDeg(clamped) + ")"
                );
                var needlePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                needlePath.setAttribute(
                    "d",
                    "M -" + needleBaseRadius + ",-2.2 L -" + needleTipRadius + ",-0.55"
                        + " A 0.7,0.7,0,0,0,-" + needleTipRadius + ",0.55"
                        + " L -" + needleBaseRadius + ",2.2"
                        + " A 1.8,1.8,0,0,0,-" + needleBaseRadius + ",-2.2 Z"
                );
                needlePath.setAttribute("fill", "currentColor");
                needleGroup.appendChild(needlePath);
                svg.appendChild(needleGroup);
                var valueText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                valueText.setAttribute("x", "0");
                valueText.setAttribute("y", "-2");
                valueText.setAttribute("text-anchor", "middle");
                valueText.setAttribute("dominant-baseline", "middle");
                valueText.setAttribute("class", "console-gauge-value-svg");
                valueText.textContent = displayText
                    || (isNaN(numericValue) ? "—" : String(numericValue));
                svg.appendChild(valueText);
                wrap.appendChild(svg);
                return wrap;
            }
            var valueEl = document.createElement("div");
            valueEl.className = "console-gauge-value";
            valueEl.textContent = displayText || (isNaN(numericValue) ? "—" : String(numericValue));
            wrap.appendChild(valueEl);
            return wrap;
        }

        function bindingClickActionForState(binding, isOn) {
            if (!binding) {

            if (isOn) {

                }
            } else if (binding.clickActionFalse) {
                return binding.clickActionFalse;
            }
            return binding.clickAction || null;
        }

        function makeBindingClickActionHandler(binding, isOn) {
            var action = bindingClickActionForState(binding, isOn);
            if (!action) {
                return null;
            }
            var stored = action;
            return function () {
                runConsoleClickAction(stored);
            };
        }

        function buildBindingRow(binding) {
            var row = document.createElement("div");
            if (binding && binding.spacer) {
                row.className = "console-device-row console-device-row--empty";
                applySpacerCellLayout(row, binding);
                return row;
            }
            row.className = "console-device-row";
            applyBindingTitleLayout(row, binding);
            appendBindingTitleElement(row, binding, "Device");
            var controls = document.createElement("div");
            controls.className = "console-device-row-controls";
            var useCustomClick = bindingHasAnyClickAction(binding);
            if (binding && binding.automation) {
                var automationName = binding.automation;
                var known = Object.prototype.hasOwnProperty.call(automationStatusByName, automationName);
                var automationOn = known && automationIsActive(automationName);
                var controlMode = normalizeAutomationControl(binding.automationControl);
                if (!automationOn) {
                    row.classList.add("is-automation-inactive");
                }
                var automationToggle = (function (name, currentlyOn) {
                    return function () {
                        setAutomationActive(name, !currentlyOn).then(function () {
                            refreshConsoleControls();
                        }).catch(function () {
                            refreshConsoleControls();
                        });
                    };
                })(automationName, automationOn);
                var actionLabel = controlMode === "run" ? "Run"
                    : (controlMode === "startTimer" ? "Start timer"
                        : (controlMode === "stopTimer" ? "Stop timer"
                            : (controlMode === "restartTimer" ? "Restart timer" : "Automation on off")));
                var autoClick = useCustomClick
                    ? makeBindingClickActionHandler(binding, automationOn)
                    : null;
                if (!autoClick && known && controlMode === "enableDisable") {
                    autoClick = automationToggle;
                } else if (!autoClick && known && controlMode !== "enableDisable") {
                    autoClick = (function (name, mode) {
                        return function (event) {
                            var iconTarget = event && event.currentTarget;
                            var canFlash = automationIsActive(name);
                            runAutomationControl(name, mode).then(function () {
                                if (canFlash) {
                                    flashAutomationIcon(iconTarget);
                                }
                                refreshConsoleControls();
                            }).catch(function () {
                                refreshConsoleControls();
                            });
                        };
                    })(automationName, controlMode);
                }
                if (controlMode !== "enableDisable" && !useCustomClick) {
                    if (binding.viewStyle === "icon") {
                        controls.appendChild(buildConsoleIconElement(
                            binding,
                            automationOn ? "ON" : "OFF",
                            {
                                interactive: true,
                                actionControl: true,
                                disabled: !known,
                                ariaLabel: actionLabel,
                                onclick: autoClick
                            }
                        ));
                    } else {
                        var actionBtn = document.createElement("button");
                        actionBtn.type = "button";
                        actionBtn.className = "btn btn-secondary btn-inline";
                        actionBtn.textContent = actionLabel;
                        actionBtn.disabled = !known;
                        if (autoClick) {
                            actionBtn.onclick = autoClick;
                        }
                        controls.appendChild(actionBtn);
                    }
                } else if (binding.viewStyle === "icon") {
                    controls.appendChild(buildConsoleIconElement(
                        binding,
                        automationOn ? "ON" : "OFF",
                        {
                            interactive: true,
                            actionControl: controlMode !== "enableDisable",
                            disabled: !useCustomClick && !known,
                            ariaLabel: useCustomClick ? "Run click action" : actionLabel,
                            onclick: autoClick
                        }
                    ));
                } else {
                    var automationSwitch = document.createElement("button");
                    automationSwitch.type = "button";
                    automationSwitch.className = "console-switch"
                        + (automationOn ? " is-on" : "")
                        + ((!useCustomClick && !known) ? " is-disabled" : "");
                    automationSwitch.setAttribute("aria-label", useCustomClick ? "Run click action" : "Automation on off");
                    if (!useCustomClick && !known) {
                        automationSwitch.disabled = true;
                    } else if (autoClick) {
                        automationSwitch.onclick = autoClick;
                    }
                    controls.appendChild(automationSwitch);
                }
                row.appendChild(controls);
                return row;
            }
            var device = findRegisteredDevice(binding.ieee);
            if (!device) {
                var unavailable = document.createElement("span");
                unavailable.className = "console-device-unavailable";
                unavailable.textContent = "unavailable";
                controls.appendChild(unavailable);
                row.appendChild(controls);
                return row;
            }
            var typeId = device.type || "";
            var channel = bindingChannel(binding);
            var param = bindingParamId(binding);
            var showTypeControls = param === "status"
                || param === ""
                || (typeId === "windowCovering" && param === "position");
            if (showTypeControls && typeId === "onOff") {
                var onState = onOffStateForBinding(device, binding);
                var onOffIsOn = String(onState).toUpperCase() === "ON";
                var onOffToggle = (function (ieee, ch, currentOn) {
                    return function () {
                        sendDeviceCommand(ieee, currentOn ? "OFF" : "ON", ch);
                        window.setTimeout(refreshConsoleControls, 300);
                    };
                })(device.ieee, channel, onOffIsOn);
                var onOffClick = useCustomClick
                    ? makeBindingClickActionHandler(binding, onOffIsOn)
                    : onOffToggle;
                if (binding.viewStyle === "icon") {
                    controls.appendChild(buildConsoleIconElement(
                        binding,
                        onOffIsOn ? "ON" : "OFF",
                        {
                            interactive: true,
                            ariaLabel: useCustomClick ? "Run click action" : "Device on off",
                            onclick: onOffClick
                        }
                    ));
                } else {
                    var onOffSwitch = document.createElement("button");
                    onOffSwitch.type = "button";
                    onOffSwitch.className = "console-switch" + (onOffIsOn ? " is-on" : "");
                    onOffSwitch.onclick = onOffClick;
                    controls.appendChild(onOffSwitch);
                }
            } else if (bindingUsesAsLogical(device, binding)) {
                var logicalState = bindingLogicalStateText(
                    binding,
                    userBindingNumericValue(device, binding)
                );
                if (binding.viewStyle === "icon") {
                    var logicalClick = useCustomClick
                        ? makeBindingClickActionHandler(binding, isBinaryStateOn(logicalState))
                        : null;
                    controls.appendChild(buildConsoleIconElement(
                        binding,
                        logicalState,
                        logicalClick
                            ? {
                                interactive: true,
                                ariaLabel: "Run click action",
                                onclick: logicalClick
                            }
                            : {}
                    ));
                } else {
                    var logicalLabel = document.createElement("span");
                    logicalLabel.className = "console-sensor-value";
                    logicalLabel.textContent = logicalState;
                    controls.appendChild(logicalLabel);
                }
            } else if (binding.viewStyle === "icon"
                && (isBinarySensorDeviceType(typeId)
                    || (typeId === "userData"
                        && userDataFieldTypeForParam(device, param) === "bool"))) {
                var binaryState = bindingResolvedState(device, binding);
                var binaryClick = useCustomClick
                    ? makeBindingClickActionHandler(binding, isBinaryStateOn(binaryState))
                    : null;
                controls.appendChild(buildConsoleIconElement(
                    binding,
                    binaryState,
                    binaryClick
                        ? {
                            interactive: true,
                            ariaLabel: "Run click action",
                            onclick: binaryClick
                        }
                        : {}
                ));
            } else if (showTypeControls && typeId === "windowCovering") {
                var openButton = document.createElement("button");
                openButton.type = "button";
                openButton.className = "btn btn-secondary btn-inline console-cover-btn";
                openButton.textContent = "OPEN";
                openButton.onclick = (function (ieee, ch) {
                    return function () {
                        sendDeviceCommand(ieee, "OPEN", ch);
                    };
                })(device.ieee, channel);
                var closeButton = document.createElement("button");
                closeButton.type = "button";
                closeButton.className = "btn btn-secondary btn-inline console-cover-btn";
                closeButton.textContent = "CLOSE";
                closeButton.onclick = (function (ieee, ch) {
                    return function () {
                        sendDeviceCommand(ieee, "CLOSE", ch);
                    };
                })(device.ieee, channel);
                var stopButton = document.createElement("button");
                stopButton.type = "button";
                stopButton.className = "btn btn-secondary btn-inline console-cover-btn";
                stopButton.textContent = "STOP";
                stopButton.onclick = (function (ieee, ch) {
                    return function () {
                        sendDeviceCommand(ieee, "STOP", ch);
                    };
                })(device.ieee, channel);
                var position = document.createElement("span");
                position.className = "console-cover-position";
                var entries = statusEntriesForDevice(device);
                var coveringEntry = findStatusEntry(entries, channel);
                position.textContent = coveringEntry && coveringEntry.position
                    ? coveringEntry.position
                    : coveringPositionText(coveringEntry ? coveringEntry.state : "");
                controls.appendChild(openButton);
                controls.appendChild(closeButton);
                controls.appendChild(stopButton);
                controls.appendChild(position);
            } else if (useCustomClick && binding.viewStyle === "icon") {
                var clickIconState = bindingResolvedState(device, binding) || "OFF";
                var clickIconHandler = makeBindingClickActionHandler(
                    binding,
                    isBinaryStateOn(clickIconState)
                );
                controls.appendChild(buildConsoleIconElement(
                    binding,
                    clickIconState,
                    {
                        interactive: true,
                        ariaLabel: "Run click action",
                        onclick: clickIconHandler
                    }
                ));
            } else if (binding.viewStyle === "gauge") {
                row.classList.add("console-device-row--gauge");
                var rawState = bindingResolvedState(device, binding);
                var gaugeNumeric;
                var gaugeDisplay;
                if (isMeasurementDeviceType(typeId) && param !== "battery") {
                    gaugeNumeric = measurementNumericValue(typeId, rawState, binding.unit);
                    gaugeDisplay = measurementGaugeDisplay(
                        typeId,
                        rawState,
                        binding.unit,
                        bindingDecimals(binding, typeId)
                    );
                } else {
                    gaugeNumeric = parseBindingNumericValue(rawState);
                    gaugeDisplay = rawState || "";
                }
                controls.appendChild(buildConsoleGaugeElement(
                    binding,
                    gaugeNumeric,
                    gaugeDisplay
                ));
            } else if (isMeasurementDeviceType(typeId) && param !== "battery") {
                var valueLabel = document.createElement("span");
                valueLabel.className = "console-sensor-value";
                valueLabel.textContent = formatMeasurementDisplay(
                    typeId,
                    measurementStateForBinding(device, binding),
                    binding.unit,
                    bindingDecimals(binding, typeId)
                );
                controls.appendChild(valueLabel);
            } else {
                var generic = document.createElement("span");
                generic.className = "console-sensor-value";
                generic.textContent = bindingResolvedState(device, binding) || "—";
                controls.appendChild(generic);
            }
            row.appendChild(controls);
            return row;
        }

        function applyDevicesLiveMessage(text) {
            var message;
            try {
                message = JSON.parse(text);
            } catch (parseError) {
                return;
            }
            if (!message || !message.op) {
                return;
            }
            if (message.op === "pong") {
                devicesLiveLiveness.notePong();
                return;
            }
            if (message.op === "reload") {
                loadDevices();
                return;
            }
            if (message.op === "remove") {
                var removedIeee = message.ieee || "";
                var keptRows = [];
                var keepIndex;
                for (keepIndex = 0; keepIndex < registeredDeviceRows.length; keepIndex++) {
                    if ((registeredDeviceRows[keepIndex].ieee || "") !== removedIeee) {
                        keptRows.push(registeredDeviceRows[keepIndex]);
                    }
                }
                registeredDeviceRows = keptRows;
                refreshConsoleControls();
                return;
            }
            if (message.op === "upsert" && message.device) {
                var nextDevice = message.device;
                var replaced = false;
                var rowIndex;
                for (rowIndex = 0; rowIndex < registeredDeviceRows.length; rowIndex++) {
                    if ((registeredDeviceRows[rowIndex].ieee || "") === (nextDevice.ieee || "")) {
                        registeredDeviceRows[rowIndex] = nextDevice;
                        replaced = true;
                        break;
                    }
                }
                if (!replaced) {
                    registeredDeviceRows.push(nextDevice);
                }
                refreshConsoleControls();
            }
        }

        function stopDevicesLive() {
            devicesLiveWanted = false;
            devicesLiveLiveness.stop();
            if (devicesLiveReconnectTimer != null) {
                window.clearTimeout(devicesLiveReconnectTimer);
                devicesLiveReconnectTimer = null;
            }
            if (devicesLiveSocket != null) {
                devicesLiveSocket.onclose = null;
                devicesLiveSocket.close();
                devicesLiveSocket = null;
            }
        }

        function openDevicesLiveSocket() {
            if (!devicesLiveWanted || firmwareRebootWaitActive) {
                return;
            }
            if (devicesLiveSocket != null
                && (devicesLiveSocket.readyState === WebSocket.OPEN
                    || devicesLiveSocket.readyState === WebSocket.CONNECTING)) {
                return;
            }
            var protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            var socket = new WebSocket(protocol + "//" + window.location.host + "/ws/devices");
            devicesLiveSocket = socket;
            socket.onopen = function () {
                if (devicesLiveSocket === socket) {
                    devicesLiveLiveness.bind(socket);
                }
            };
            socket.onmessage = function (event) {
                applyDevicesLiveMessage(event.data);
            };
            socket.onclose = function () {
                devicesLiveLiveness.stop();
                devicesLiveSocket = null;
                if (!devicesLiveWanted || firmwareRebootWaitActive) {
                    return;
                }
                devicesLiveReconnectTimer = window.setTimeout(openDevicesLiveSocket, 2000);
            };
        }

        function startDevicesLive() {
            devicesLiveWanted = true;
            loadDevices();
            openDevicesLiveSocket();
        }

        function applyConsolesLiveMessage(text) {
            var message;
            try {
                message = JSON.parse(text);
            } catch (parseError) {
                return;
            }
            if (!message || !message.op) {
                return;
            }
            if (message.op === "pong") {
                consolesLiveLiveness.notePong();
                return;
            }
            if (message.op !== "reload") {
                return;
            }
            loadUserConsoles();
        }

        function stopConsolesLive() {
            consolesLiveWanted = false;
            consolesLiveLiveness.stop();
            if (consolesLiveReconnectTimer != null) {
                window.clearTimeout(consolesLiveReconnectTimer);
                consolesLiveReconnectTimer = null;
            }
            if (consolesLiveSocket != null) {
                consolesLiveSocket.onclose = null;
                consolesLiveSocket.close();
                consolesLiveSocket = null;
            }
        }

        function openConsolesLiveSocket() {
            if (!consolesLiveWanted || firmwareRebootWaitActive) {
                return;
            }
            if (consolesLiveSocket != null
                && (consolesLiveSocket.readyState === WebSocket.OPEN
                    || consolesLiveSocket.readyState === WebSocket.CONNECTING)) {
                return;
            }
            var protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            var socket = new WebSocket(protocol + "//" + window.location.host + "/ws/consoles");
            consolesLiveSocket = socket;
            socket.onopen = function () {
                if (consolesLiveSocket === socket) {
                    consolesLiveLiveness.bind(socket);
                }
            };
            socket.onmessage = function (event) {
                applyConsolesLiveMessage(event.data);
            };
            socket.onclose = function () {
                consolesLiveLiveness.stop();
                consolesLiveSocket = null;
                if (!consolesLiveWanted || firmwareRebootWaitActive) {
                    return;
                }
                consolesLiveReconnectTimer = window.setTimeout(openConsolesLiveSocket, 2000);
            };
        }

        function startConsolesLive() {
            consolesLiveWanted = true;
            openConsolesLiveSocket();
        }

        function recoverWantedLiveSocket(wanted, socket, setSocket, liveness, reconnectTimer, setReconnectTimer, openFn) {
            if (!wanted) {
                return;
            }
            if (reconnectTimer != null) {
                window.clearTimeout(reconnectTimer);
                setReconnectTimer(null);
            }
            if (socket != null
                && socket.readyState !== WebSocket.OPEN
                && socket.readyState !== WebSocket.CONNECTING) {
                liveness.stop();
                try {
                    socket.onclose = null;
                    socket.close();
                } catch (closeError) {
                }
                setSocket(null);
                socket = null;
            }
            if (socket != null && socket.readyState === WebSocket.OPEN) {
                liveness.bind(socket);
                return;
            }
            openFn();
        }

        function recoverConsoleLiveLinks() {
            if (!signedInUser || firmwareRebootWaitActive) {
                return;
            }
            recoverWantedLiveSocket(
                devicesLiveWanted,
                devicesLiveSocket,
                function (nextSocket) {
                    devicesLiveSocket = nextSocket;
                },
                devicesLiveLiveness,
                devicesLiveReconnectTimer,
                function (nextTimer) {
                    devicesLiveReconnectTimer = nextTimer;
                },
                openDevicesLiveSocket
            );
            recoverWantedLiveSocket(
                consolesLiveWanted,
                consolesLiveSocket,
                function (nextSocket) {
                    consolesLiveSocket = nextSocket;
                },
                consolesLiveLiveness,
                consolesLiveReconnectTimer,
                function (nextTimer) {
                    consolesLiveReconnectTimer = nextTimer;
                },
                openConsolesLiveSocket
            );
            startSessionWatch();
            if (devicesLiveWanted) {
                loadDevices();
            }
            if (consolesLiveWanted) {
                loadUserConsoles();
            }
        }

        function loadDevices() {
            fetch("/api/devices", { cache: "no-store" }).then(function (response) {
                return response.text().then(function (text) {
                    if (!response.ok) {
                        throw new Error("HTTP " + response.status);
                    }
                    return JSON.parse(text);
                });
            }).then(function (rows) {
                registeredDeviceRows = Array.isArray(rows) ? rows : [];
                refreshConsoleControls();
            }).catch(function () {
            });
        }

        function onDialogOverlayPointerDown(event) {
            if (event.target !== event.currentTarget) {
                return;
            }
            if (!document.getElementById("signOutConfirmDialog").hidden) {
                closeSignOutConfirm();
            }
        }

        window.onload = function () {
            var loginForm = document.getElementById("loginForm");
            if (loginForm) {
                loginForm.addEventListener("submit", function (event) {
                    event.preventDefault();
                    submitLogin();
                });
            }
            var overlay = document.getElementById("signOutConfirmDialog");
            if (overlay) {
                overlay.addEventListener("mousedown", onDialogOverlayPointerDown);
            }
            applyThemeToDocument("dark");
            document.addEventListener("visibilitychange", function () {
                if (document.visibilityState === "visible") {
                    recoverConsoleLiveLinks();
                }
            });
            window.addEventListener("pageshow", function () {
                recoverConsoleLiveLinks();
            });
            checkSession();
        };
    </script>
</head>
<body>
<div id="loginOverlay" class="login-overlay">
    <form id="loginForm" class="login-panel" autocomplete="on">
        <h1 class="section-title">Sign in</h1>
        <p id="loginError" class="save-error" hidden></p>
        <div class="field">
            <label for="loginUserName">User name</label>
            <input id="loginUserName" type="text" autocomplete="username">
        </div>
        <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password">
        </div>
        <label class="field-check">
            <input id="loginRememberMe" type="checkbox">
            Remember me
        </label>
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
</div>
<div id="userShell" class="user-console-shell" hidden>
    <div class="user-console-toolbar">
        <div id="consoleTabs" class="tabs user-console-tabs" hidden></div>
    </div>
    <div id="consolePanels" class="user-console-panels" hidden></div>
    <p id="emptyState" class="field-hint user-console-empty" hidden>No consoles are assigned to your account.</p>
</div>
<div id="signOutConfirmDialog" class="dialog-overlay dialog-overlay-front" hidden>
    <div class="dialog-panel" role="dialog" aria-label="Sign out">
        <h3 class="upload-title">Sign out</h3>
        <p class="field-hint">Sign out of the control page?</p>
        <div class="dialog-actions">
            <button type="button" class="btn btn-primary" onclick="signOut()">Sign out</button>
            <button type="button" class="btn btn-secondary" onclick="closeSignOutConfirm()">Cancel</button>
        </div>
    </div>
</div>
</body>
</html>
