<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control consoles</title>
    <link rel="stylesheet" type="text/css" href="css/all.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"/>
    <script src="/js/scene.js"></script>
    <script>


        function historyEpsilonEnabled(epsilon, typeId) {
            var value = epsilon != null ? Number(epsilon) : -1;
            if (isNaN(value)) value = -1;
            if (String(typeId || "") === "string") return value === 0;
            return value >= 0;
        }
        function historyReportableIdsEqual(left, right) {
            var leftNum = parseInt(String(left || ""), 0);
            var rightNum = parseInt(String(right || ""), 0);
            if (!isNaN(leftNum) && !isNaN(rightNum)) {
                return (leftNum & 0xFFFF) === (rightNum & 0xFFFF);
            }
            return String(left || "").toLowerCase() === String(right || "").toLowerCase();
        }
        function bindingHistoryEnabled(device, binding) {
            if (!device || !binding) return false;
            var param = binding.param || "";
            var reportable = typeof parseReportableParamId === "function" ? parseReportableParamId(param) : null;
            if (reportable) {
                var rows = Array.isArray(device.reportableData) ? device.reportableData : [];
                for (var rowIndex = 0; rowIndex < rows.length; rowIndex++) {
                    var row = rows[rowIndex] || {};
                    if (historyReportableIdsEqual(row.cluster, reportable.cluster)
                        && historyReportableIdsEqual(row.attribute, reportable.attribute)) {
                        return historyEpsilonEnabled(row.epsilon, row.type);
                    }
                }
                return false;
            }
            var userDataFields = Array.isArray(device.userDataFields) ? device.userDataFields : [];
            for (var fieldIndex = 0; fieldIndex < userDataFields.length; fieldIndex++) {
                var field = userDataFields[fieldIndex] || {};
                if (String(field.name || "") === param) {
                    return historyEpsilonEnabled(field.epsilon, field.type);
                }
            }
            return historyEpsilonEnabled(device.historyEpsilon, "float");
        }
        function historyQueryForBinding(device, binding) {
            if (!device || !device.ieee || !binding) return null;
            if (!bindingHistoryEnabled(device, binding)) return null;
            var query = { ieee: device.ieee, title: binding.title || device.name || "History" };
            var param = binding.param || "";
            var reportable = typeof parseReportableParamId === "function" ? parseReportableParamId(param) : null;
            if (reportable) {
                query.kind = "reportable";
                query.cluster = reportable.cluster;
                query.attribute = reportable.attribute;
                return query;
            }
            var userDataFields = Array.isArray(device.userDataFields) ? device.userDataFields : [];
            var fieldIndex;
            for (fieldIndex = 0; fieldIndex < userDataFields.length; fieldIndex++) {
                var field = userDataFields[fieldIndex] || {};
                if (String(field.name || "") === param) {
                    query.kind = "reportable";
                    query.cluster = 0xFC00;
                    query.attribute = 0x0100 + fieldIndex;
                    return query;
                }
            }
            query.kind = "main";
            query.channel = binding.channel || 1;
            return query;
        }
        function attachHistoryOpen(element, device, binding) {
            if (!element || !device || !binding) return;
            if (!bindingHistoryEnabled(device, binding)) return;
            element.style.cursor = "pointer";
            element.title = "Open history";
            element.onclick = function (event) {
                if (event) event.stopPropagation();
                var query = historyQueryForBinding(device, binding);
                if (query) openHistoryChart(query);
            };
        }

        var HISTORY_EPOCH_UNIX_OFFSET = 1262304000;
        var historyChartState = {
            query: null,
            hours: 24,
            rangeEndUnix: 0,
            payload: null,
            layout: null,
            smooth: false,
            smoothWindow: 5
        };
        var HISTORY_STATE_COLORS = [
            "#03a9f4", "#4caf50", "#ff9800", "#f44336", "#9c27b0",
            "#00bcd4", "#8bc34a", "#ffc107", "#e91e63", "#607d8b"
        ];
        function historyUnixToEpoch2010(unixSec) {
            var value = Number(unixSec) || 0;
            return value > HISTORY_EPOCH_UNIX_OFFSET ? Math.floor(value - HISTORY_EPOCH_UNIX_OFFSET) : 0;
        }
        function historyEpoch2010ToUnix(epoch2010) {
            return (Number(epoch2010) || 0) + HISTORY_EPOCH_UNIX_OFFSET;
        }
        function historyFormatAxisTime(unixSec, hoursSpan) {
            var date = new Date(unixSec * 1000);
            if (isNaN(date.getTime())) return "";
            if (hoursSpan <= 24) return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            return date.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
        }
        var HISTORY_Y_INTERVALS = 4;
        function historyNiceNum(value, round) {
            var x = Math.abs(Number(value));
            if (!isFinite(x) || x === 0) return 1;
            var exp = Math.floor(Math.log(x) / Math.LN10);
            var frac = x / Math.pow(10, exp);
            var niceFrac;
            if (round) {
                if (frac < 1.5) niceFrac = 1;
                else if (frac < 3) niceFrac = 2;
                else if (frac < 7) niceFrac = 5;
                else niceFrac = 10;
            } else if (frac <= 1) niceFrac = 1;
            else if (frac <= 2) niceFrac = 2;
            else if (frac <= 5) niceFrac = 5;
            else niceFrac = 10;
            return niceFrac * Math.pow(10, exp);
        }
        function historyNextNiceStep(step) {
            var x = Number(step);
            if (!isFinite(x) || x <= 0) return 1;
            var exp = Math.floor(Math.log(x) / Math.LN10);
            var base = x / Math.pow(10, exp);
            var nextBase;
            if (base < 1.5) nextBase = 2;
            else if (base < 3) nextBase = 5;
            else if (base < 7) nextBase = 10;
            else nextBase = 20;
            return nextBase * Math.pow(10, exp);
        }
        function historyFormatAxisValue(value, step) {
            var numeric = Number(value);
            if (!isFinite(numeric)) return "";
            var axisStep = Number(step);
            if (!isFinite(axisStep) || axisStep <= 0) axisStep = 1;
            var rounded = Math.round(numeric / axisStep) * axisStep;
            if (Math.abs(rounded) < axisStep * 1e-9) rounded = 0;
            var decimals = 0;
            if (axisStep < 1) {
                decimals = Math.max(0, Math.min(6, Math.ceil(-Math.log10(axisStep) - 1e-12)));
            }
            return decimals > 0 ? rounded.toFixed(decimals) : String(Math.round(rounded));
        }
        function historyComputeNumericAxis(dataMin, dataMax) {
            var intervals = HISTORY_Y_INTERVALS;
            var dmin = Number(dataMin);
            var dmax = Number(dataMax);
            if (!isFinite(dmin) || !isFinite(dmax)) { dmin = 0; dmax = 1; }
            if (dmin > dmax) { var swap = dmin; dmin = dmax; dmax = swap; }
            if (dmax - dmin < 1e-12) { dmin -= 1; dmax += 1; }
            var crossesZero = dmin < 0 && dmax > 0;
            var step = historyNiceNum((dmax - dmin) / intervals, true);
            if (!isFinite(step) || !(step > 0)) step = 1;
            var minV = 0;
            var maxV = intervals * step;
            var guard;
            if (crossesZero) {
                for (guard = 0; guard < 24; guard++) {
                    var below = Math.ceil((-dmin) / step - 1e-12);
                    var above = Math.ceil(dmax / step - 1e-12);
                    if (below < 1) below = 1;
                    if (above < 1) above = 1;
                    if (below + above <= intervals) {
                        var spare = intervals - below - above;
                        var addBelow = Math.floor(spare / 2);
                        var addAbove = spare - addBelow;
                        minV = -(below + addBelow) * step;
                        maxV = (above + addAbove) * step;
                        break;
                    }
                    step = historyNextNiceStep(step);
                }
            } else {
                for (guard = 0; guard < 24; guard++) {
                    // Loose nice bounds: always cover data (ceil top, floor bottom).
                    minV = Math.floor(dmin / step) * step;
                    maxV = Math.ceil(dmax / step) * step;
                    if (maxV - minV < step - 1e-12) {
                        maxV = minV + step;
                    }
                    var usedSteps = Math.round((maxV - minV) / step);
                    if (usedSteps > intervals) {
                        step = historyNextNiceStep(step);
                        continue;
                    }
                    var spareSteps = intervals - usedSteps;
                    var addLow = Math.floor(spareSteps / 2);
                    var addHigh = spareSteps - addLow;
                    if (dmax < 0) {
                        addLow = spareSteps;
                        addHigh = 0;
                    } else if (dmin > 0) {
                        addLow = 0;
                        addHigh = spareSteps;
                    }
                    minV -= addLow * step;
                    maxV += addHigh * step;
                    if (dmin >= 0 && minV < 0) {
                        maxV -= minV;
                        minV = 0;
                    }
                    if (dmax < 0 && maxV > 0) {
                        minV -= maxV;
                        maxV = 0;
                    }
                    if (minV > dmin + 1e-12 || maxV < dmax - 1e-12
                        || Math.round((maxV - minV) / step) > intervals) {
                        step = historyNextNiceStep(step);
                        continue;
                    }
                    if (Math.round((maxV - minV) / step) < intervals) {
                        if (dmax < 0) {
                            minV = maxV - intervals * step;
                        } else {
                            maxV = minV + intervals * step;
                        }
                        if (minV > dmin + 1e-12 || maxV < dmax - 1e-12) {
                            step = historyNextNiceStep(step);
                            continue;
                        }
                    }
                    var spareLow = dmin - minV;
                    var spareHigh = maxV - dmax;
                    var shift = Math.round((spareLow - spareHigh) / (2 * step)) * step;
                    if (shift !== 0) {
                        var shiftedMin = minV + shift;
                        var shiftedMax = maxV + shift;
                        if (shiftedMin <= dmin + 1e-12 && shiftedMax >= dmax - 1e-12
                            && !(dmin >= 0 && shiftedMin < 0)
                            && !(dmax < 0 && shiftedMax > 0)) {
                            minV = shiftedMin;
                            maxV = shiftedMax;
                        }
                    }
                    break;
                }
            }
            return { minV: minV, maxV: maxV, step: step };
        }
        function historyFormatTooltipTime(unixSec) {
            var date = new Date(unixSec * 1000);
            if (isNaN(date.getTime())) return "";
            return date.toLocaleString([], {
                year: "numeric", month: "short", day: "numeric",
                hour: "2-digit", minute: "2-digit", second: "2-digit"
            });
        }
        function historyToDatetimeLocalValue(unixSec) {
            var date = new Date(unixSec * 1000);
            if (isNaN(date.getTime())) return "";
            var pad = function (n) { return (n < 10 ? "0" : "") + n; };
            return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
                + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
        }
        function historyParseDatetimeLocalValue(text) {
            if (!text) return NaN;
            var parsed = Date.parse(text);
            return isNaN(parsed) ? NaN : Math.floor(parsed / 1000);
        }
        function historyDiscreteLabel(value) {
            if (value === true || value === 1 || value === "1" || value === "on" || value === "ON" || value === "true") return "on";
            if (value === false || value === 0 || value === "0" || value === "off" || value === "OFF" || value === "false") return "off";
            return String(value == null ? "" : value);
        }
        function historyColorForState(label) {
            var key = String(label || "").toLowerCase();
            if (key === "on" || key === "open" || key === "true" || key === "leak") return "#4caf50";
            if (key === "off" || key === "closed" || key === "false" || key === "dry") return "#44739e";
            var hash = 0, index;
            for (index = 0; index < key.length; index++) { hash = ((hash << 5) - hash) + key.charCodeAt(index); hash |= 0; }
            return HISTORY_STATE_COLORS[Math.abs(hash) % HISTORY_STATE_COLORS.length];
        }
        function historySyncRangeControls() {
            var startInput = document.getElementById("historyChartStart");
            var endInput = document.getElementById("historyChartEnd");
            var endUnix = historyChartState.rangeEndUnix || Math.floor(Date.now() / 1000);
            var startUnix = endUnix - Math.floor(historyChartState.hours * 3600);
            if (startInput) startInput.value = historyToDatetimeLocalValue(startUnix);
            if (endInput) endInput.value = historyToDatetimeLocalValue(endUnix);
            var presetButtons = document.querySelectorAll("[data-history-hours]");
            for (var buttonIndex = 0; buttonIndex < presetButtons.length; buttonIndex++) {
                var button = presetButtons[buttonIndex];
                if (Number(button.getAttribute("data-history-hours")) === historyChartState.hours) button.classList.add("is-active");
                else button.classList.remove("is-active");
            }
        }
        function historyFetchAndDraw() {
            var canvas = document.getElementById("historyChartCanvas");
            var query = historyChartState.query;
            if (!canvas || !query) return;
            var endUnix = historyChartState.rangeEndUnix || Math.floor(Date.now() / 1000);
            var startUnix = endUnix - Math.floor(historyChartState.hours * 3600);
            if (startUnix < 0) startUnix = 0;
            historySyncRangeControls();
            var params = new URLSearchParams();
            params.set("ieee", query.ieee || "");
            params.set("kind", query.kind || "main");
            if (query.channel != null) params.set("channel", String(query.channel));
            if (query.cluster != null) params.set("cluster", String(query.cluster));
            if (query.attribute != null) params.set("attribute", String(query.attribute));
            params.set("from", String(historyUnixToEpoch2010(startUnix)));
            params.set("to", String(historyUnixToEpoch2010(endUnix)));
            params.set("maxPoints", "128");
            fetch("/api/history?" + params.toString(), { cache: "no-store" })
                .then(function (r) {
                    if (!r.ok) throw new Error("history " + r.status);
                    return r.json();
                })
                .then(function (payload) {
                    historyChartState.payload = payload || { valueType: "float", points: [] };
                    historySyncSmoothControls();
                    drawHistoryChart(canvas, historyChartState.payload, startUnix, endUnix);
                    window.requestAnimationFrame(function () {
                        historyRedrawFromPayload();
                    });
                })
                .catch(function () {
                    historyChartState.payload = { valueType: "float", points: [] };
                    historySyncSmoothControls();
                    drawHistoryChart(canvas, historyChartState.payload, startUnix, endUnix);
                    window.requestAnimationFrame(function () {
                        historyRedrawFromPayload();
                    });
                });
        }
        function historySmoothWindowSize() {
            var input = document.getElementById("historyChartSmoothWindow");
            var value = input ? Number(input.value) : historyChartState.smoothWindow;
            if (!isFinite(value) || value < 1) value = 5;
            value = Math.floor(value);
            if (value < 1) value = 1;
            if (value > 128) value = 128;
            historyChartState.smoothWindow = value;
            if (input && String(input.value) !== String(value)) input.value = String(value);
            return value;
        }
        function historyChartIsDiscretePayload(payload) {
            var valueType = payload && payload.valueType ? String(payload.valueType) : "float";
            return valueType === "bool" || valueType === "string";
        }
        function historyChartAllowsSmooth() {
            if (!historyChartState.payload) return false;
            return !historyChartIsDiscretePayload(historyChartState.payload);
        }
        function historySyncSmoothControls() {
            var wrap = document.getElementById("historyChartSmoothControls");
            var flag = document.getElementById("historyChartSmooth");
            var input = document.getElementById("historyChartSmoothWindow");
            var allowSmooth = historyChartAllowsSmooth();
            if (wrap) wrap.hidden = !allowSmooth;
            if (!allowSmooth) return;
            if (flag) flag.checked = !!historyChartState.smooth;
            if (input) {
                input.value = String(historyChartState.smoothWindow > 0 ? historyChartState.smoothWindow : 5);
                input.disabled = !historyChartState.smooth;
            }
        }
        function onHistoryChartSmoothChange() {
            if (!historyChartAllowsSmooth()) return;
            var flag = document.getElementById("historyChartSmooth");
            historyChartState.smooth = !!(flag && flag.checked);
            historySmoothWindowSize();
            historySyncSmoothControls();
            historyRedrawFromPayload();
        }
        function onHistoryChartSmoothWindowInput() {
            if (!historyChartAllowsSmooth() || !historyChartState.smooth) return;
            var input = document.getElementById("historyChartSmoothWindow");
            var value = input ? Number(input.value) : NaN;
            if (!isFinite(value) || value < 1) return;
            historyChartState.smoothWindow = Math.min(128, Math.floor(value));
            historyRedrawFromPayload();
        }
        function historySmoothSeriesAvg(series, windowSize) {
            var windowCount = Math.max(1, Math.floor(Number(windowSize) || 5));
            if (!series || !series.length || windowCount <= 1) return series || [];
            var left = Math.floor((windowCount - 1) / 2);
            var right = windowCount - 1 - left;
            var smoothed = [];
            var index;
            for (index = 0; index < series.length; index++) {
                var start = Math.max(0, index - left);
                var end = Math.min(series.length - 1, index + right);
                var sum = 0;
                var count = 0;
                var sampleIndex;
                for (sampleIndex = start; sampleIndex <= end; sampleIndex++) {
                    sum += series[sampleIndex].value;
                    count++;
                }
                smoothed.push({ unix: series[index].unix, value: sum / count });
            }
            return smoothed;
        }
        function historySmoothSeries(series, windowSize) {
            return historySmoothSeriesAvg(series, windowSize);
        }
        function historyRedrawFromPayload() {
            var canvas = document.getElementById("historyChartCanvas");
            if (!canvas || !historyChartState.payload) return;
            var endUnix = historyChartState.rangeEndUnix || Math.floor(Date.now() / 1000);
            var startUnix = endUnix - Math.floor(historyChartState.hours * 3600);
            if (startUnix < 0) startUnix = 0;
            drawHistoryChart(canvas, historyChartState.payload, startUnix, endUnix);
        }
        function openHistoryChart(query) {
            var overlay = document.getElementById("historyChartOverlay");
            var title = document.getElementById("historyChartTitle");
            if (!overlay || !query) return;
            historyChartState.query = query;
            historyChartState.payload = null;
            historyChartState.hours = 24;
            historyChartState.rangeEndUnix = Math.floor(Date.now() / 1000);
            if (historyChartState.smoothWindow < 1) historyChartState.smoothWindow = 5;
            historySyncSmoothControls();
            if (title) title.textContent = query.title || "History";
            overlay.hidden = false;
            historyChartEnsureResizeObserver();
            historyFetchAndDraw();
        }
        function closeHistoryChart() {
            var overlay = document.getElementById("historyChartOverlay");
            var tip = document.getElementById("historyChartTooltip");
            if (overlay) overlay.hidden = true;
            if (tip) tip.hidden = true;
            historyChartState.query = null;
            historyChartState.payload = null;
            historyChartState.layout = null;
        }
        function setHistoryChartPreset(hours) {
            var value = Number(hours);
            if (!(value > 0)) return;
            historyChartState.hours = value;
            historyChartState.rangeEndUnix = Math.floor(Date.now() / 1000);
            historyFetchAndDraw();
        }
        function shiftHistoryChartRange(direction) {
            var delta = Math.floor(historyChartState.hours * 3600) * (direction < 0 ? -1 : 1);
            historyChartState.rangeEndUnix =
                (historyChartState.rangeEndUnix || Math.floor(Date.now() / 1000)) + delta;
            historyFetchAndDraw();
        }
        function applyHistoryChartDatetimeRange() {
            var startUnix = historyParseDatetimeLocalValue((document.getElementById("historyChartStart") || {}).value);
            var endUnix = historyParseDatetimeLocalValue((document.getElementById("historyChartEnd") || {}).value);
            if (isNaN(startUnix) || isNaN(endUnix) || endUnix <= startUnix) return;
            historyChartState.rangeEndUnix = endUnix;
            historyChartState.hours = Math.max(1 / 60, (endUnix - startUnix) / 3600);
            historyFetchAndDraw();
        }
        function historyChartSyncLegendVisibility(legend) {
            if (!legend) {
                return;
            }
            var count = legend.children.length;
            if (count <= 1) {
                legend.innerHTML = "";
                legend.hidden = true;
            } else {
                legend.hidden = false;
            }
        }

        function historyChartEnsureResizeObserver() {
            var wrap = document.getElementById("historyChartCanvasWrap");
            if (!wrap || wrap.__historyChartRo || typeof ResizeObserver !== "function") {
                return;
            }
            wrap.__historyChartRo = new ResizeObserver(function () {
                if (!historyChartState.payload || !historyChartState.query) {
                    return;
                }
                var nextWidth = Math.floor(wrap.getBoundingClientRect().width);
                if (!(nextWidth > 0) || nextWidth === wrap.__historyChartLastW) {
                    return;
                }
                historyRedrawFromPayload();
            });
            wrap.__historyChartRo.observe(wrap);
        }

        function drawHistoryChart(canvas, payload, rangeStartUnix, rangeEndUnix) {
            if (!canvas || !canvas.getContext) return;
            var wrap = document.getElementById("historyChartCanvasWrap");
            var legend = document.getElementById("historyChartLegend");
            var tip = document.getElementById("historyChartTooltip");
            historyChartEnsureResizeObserver();
            canvas.style.width = "100%";
            canvas.style.height = "320px";
            var cssWidth = wrap ? Math.floor(wrap.getBoundingClientRect().width) : 0;
            if (!(cssWidth > 0)) {
                cssWidth = wrap && wrap.clientWidth > 0 ? wrap.clientWidth : 0;
            }
            if (!(cssWidth > 0)) {
                window.requestAnimationFrame(function () {
                    if (historyChartState.payload) {
                        historyRedrawFromPayload();

            }
            wrap.__historyChartLastW = cssWidth;
            var cssHeight = 320;
            var dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(cssWidth * dpr);
            canvas.height = Math.floor(cssHeight * dpr);
            var ctx = canvas.getContext("2d");
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            var width = cssWidth, height = cssHeight;
            var styles = getComputedStyle(document.documentElement);
            var bg = styles.getPropertyValue("--bg").trim() || "#111";
            var text = styles.getPropertyValue("--text").trim() || "#eee";
            var muted = styles.getPropertyValue("--muted").trim() || "#9aa";
            var border = styles.getPropertyValue("--border").trim() || "#444";
            var accent = styles.getPropertyValue("--accent").trim() || "#03a9f4";
            ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);
            var points = payload && Array.isArray(payload.points) ? payload.points.slice() : [];
            points.sort(function (a, b) { return (Number(a.t) || 0) - (Number(b.t) || 0); });
            var valueType = payload && payload.valueType ? payload.valueType : "float";
            var isDiscrete = valueType === "bool" || valueType === "string";
            var padLeft = isDiscrete ? 16 : 52;
            var padRight = 16, padTop = 16, padBottom = 36;
            var plotW = Math.max(10, width - padLeft - padRight);
            var plotH = Math.max(10, height - padTop - padBottom);
            var t0 = rangeStartUnix, t1 = rangeEndUnix;
            if (!(t1 > t0)) t1 = t0 + 3600;
            var hoursSpan = (t1 - t0) / 3600;
            var xForUnix = function (unixSec) { return padLeft + ((unixSec - t0) / (t1 - t0)) * plotW; };
            ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.beginPath();
            ctx.moveTo(padLeft, padTop); ctx.lineTo(padLeft, padTop + plotH); ctx.lineTo(padLeft + plotW, padTop + plotH); ctx.stroke();
            var tickCount = hoursSpan <= 6 ? 4 : (hoursSpan <= 48 ? 6 : 7);
            ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "top";
            for (var tickIndex = 0; tickIndex <= tickCount; tickIndex++) {
                var tickUnix = t0 + ((t1 - t0) * tickIndex / tickCount);
                var tickX = xForUnix(tickUnix);
                ctx.strokeStyle = border; ctx.globalAlpha = 0.35;
                ctx.beginPath(); ctx.moveTo(tickX, padTop); ctx.lineTo(tickX, padTop + plotH); ctx.stroke();
                ctx.globalAlpha = 1; ctx.fillStyle = muted;
                ctx.fillText(historyFormatAxisTime(tickUnix, hoursSpan), tickX, padTop + plotH + 8);
            }
            if (legend) {
                legend.innerHTML = "";
                legend.hidden = true;
            }
            if (tip) tip.hidden = true;
            if (!points.length) {
                ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.font = "13px sans-serif";
                ctx.fillText("No history samples in this range", padLeft + 8, padTop + plotH / 2);
                historyChartState.layout = null;
                return;
            }
            if (isDiscrete) {
                var bandTop = padTop + plotH * 0.28;
                var bandH = Math.max(28, plotH * 0.44);
                var segments = [];

        function renderConsoleTabs() {
            var tabsHost = document.getElementById("consoleTabs");
            var panelsHost = document.getElementById("consolePanels");
            var emptyState = document.getElementById("emptyState");
            if (!tabsHost || !panelsHost) {
                return;
            }
            if (!showingAccountTab && displayedConsoleIndex === activeConsoleIndex) {
                consoleScrollByIndex[activeConsoleIndex] =
                    captureConsolePanelScroll(panelsHost);
            }
            tabsHost.innerHTML = "";
            panelsHost.innerHTML = "";
            tabsHost.hidden = false;
            var tabIndex;
            for (tabIndex = 0; tabIndex < assignedConsoles.length; tabIndex++) {
                var tabButton = document.createElement("button");
                tabButton.type = "button";
                tabButton.className = "tab-btn"
                    + ((!showingAccountTab && tabIndex === activeConsoleIndex) ? " active" : "");
                tabButton.textContent = assignedConsoles[tabIndex].name || "Console";
                tabButton.onclick = (function (storedIndex) {
                    return function () {
                        selectConsoleTab(storedIndex);
                    };
                })(tabIndex);
                tabsHost.appendChild(tabButton);
            }
            appendUserConsoleAccountTab(tabsHost);
            if (showingAccountTab) {
                displayedConsoleIndex = -1;
                if (emptyState) {
                    emptyState.hidden = true;
                }
                fillUserAccountPanel(panelsHost);
                return;
            }
            stopStatusPolling();
            if (!assignedConsoles.length) {
                panelsHost.hidden = true;
                displayedConsoleIndex = -1;
                if (emptyState) {
                    emptyState.hidden = false;
                }
                return;
            }
            panelsHost.hidden = false;
            if (emptyState) {
                emptyState.hidden = true;
            }
            var panel = document.createElement("div");
            panel.className = "tab-content user-console-tab";
            renderConsoleGrid(panel, assignedConsoles[activeConsoleIndex]);
            panelsHost.appendChild(panel);
            displayedConsoleIndex = activeConsoleIndex;
            restoreConsolePanelScroll(
                panelsHost,
                consoleScrollByIndex[activeConsoleIndex]
            );
        }

        function normalizeIeeeText(text) {
            return String(text || "").replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        }

        function findRegisteredDevice(ieee) {
            var want = normalizeIeeeText(ieee);
            if (!want) {
                return null;
            }
            var index;
            for (index = 0; index < registeredDeviceRows.length; index++) {
                if (normalizeIeeeText(registeredDeviceRows[index].ieee) === want) {
                    return registeredDeviceRows[index];
                }
            }
            return null;
        }

        function statusEntriesForDevice(device) {
            var entries = [];
            var raw = device && device.status;
            if (!raw || !raw.length) {
                return entries;
            }
            var index;
            for (index = 0; index < raw.length; index++) {
                entries.push({
                    ep: raw[index].ep,
                    state: raw[index].state || "",
                    move: raw[index].move || "",
                    position: raw[index].position || ""
                });
            }
            entries.sort(function (left, right) {
                return (left.ep || 0) - (right.ep || 0);
            });
            return entries;
        }

        function findStatusEntry(entries, endpoint) {
            var index;
            for (index = 0; index < entries.length; index++) {
                if (entries[index].ep == endpoint) {
                    return entries[index];
                }
            }
            return null;
        }

        function findStatusState(entries, endpoint) {
            var entry = findStatusEntry(entries, endpoint);
            return entry ? (entry.state || "") : "";
        }

        function measurementStateForBinding(device, binding) {
            var entries = statusEntriesForDevice(device);
            var matched = findStatusState(entries, bindingChannel(binding));
            if (matched) {
                return matched;
            }
            var index;
            for (index = 0; index < entries.length; index++) {
                if (entries[index].state) {
                    return entries[index].state;
                }
            }
            return "";
        }

        function bindingParamId(binding) {
            return binding && binding.param ? String(binding.param) : "status";
        }

        function formatReportableIdToken(value) {
            if (value === undefined || value === null || value === "") {
                return "";
            }
            if (typeof value === "number") {
                return "0x" + ("0000" + (value & 0xFFFF).toString(16).toUpperCase()).slice(-4);
            }
            var text = String(value).trim();
            if (!text) {
                return "";
            }
            var parsed = parseInt(text, 0);
            if (isNaN(parsed)) {
                return text;
            }
            return "0x" + ("0000" + (parsed & 0xFFFF).toString(16).toUpperCase()).slice(-4);
        }

        var REPORTABLE_PARAM_PREFIX = "reportable:";

        function reportableBindingKey(cluster, attribute) {
            return formatReportableIdToken(cluster) + "/" + formatReportableIdToken(attribute);
        }

        function reportableParamId(cluster, attribute) {
            return REPORTABLE_PARAM_PREFIX + reportableBindingKey(cluster, attribute);
        }

        function parseReportableParamId(paramId) {
            var text = String(paramId || "");
            if (text.indexOf(REPORTABLE_PARAM_PREFIX) !== 0) {
                return null;
            }
            var key = text.substring(REPORTABLE_PARAM_PREFIX.length);
            var parts = key.split("/");
            if (parts.length < 2) {
                return null;
            }
            return {
                cluster: formatReportableIdToken(parts[0]),
                attribute: formatReportableIdToken(parts[1])
            };
        }

        function reportableAttributeIsWildcard(attribute) {
            if (attribute === undefined || attribute === null || attribute === "") {
                return true;
            }
            var parsed = parseInt(attribute, 0);
            return !isNaN(parsed) && parsed === 0;
        }

        function reportableValueMatchesWanted(row, wantedCluster, wantedAttribute) {
            if (!row) {
                return false;
            }
            if (formatReportableIdToken(row.cluster) !== formatReportableIdToken(wantedCluster)) {
                return false;
            }
            if (reportableAttributeIsWildcard(wantedAttribute)) {
                return true;
            }
            return formatReportableIdToken(row.attribute) === formatReportableIdToken(wantedAttribute);
        }

        function reportableValueForParam(device, paramId, channel) {
            var parsed = parseReportableParamId(paramId);
            if (!parsed || !device) {
                return "";
            }
            var values = Array.isArray(device.reportableValues) ? device.reportableValues : [];
            var index;
            for (index = 0; index < values.length; index++) {
                var row = values[index];
                if (!row) {
                    continue;
                }
                if ((row.ep == null || row.ep == channel)
                    && reportableValueMatchesWanted(row, parsed.cluster, parsed.attribute)) {
                    return row.value != null ? String(row.value) : "";
                }
            }
            return "";
        }

        function normalizeBindingParamForDevice(device, binding) {

                var emptyOnly = document.createElement("p");
                emptyOnly.className = "field-hint";
                emptyOnly.textContent = "This console has no widgets yet.";
                host.appendChild(emptyOnly);
                return;
            }
            host.appendChild(grid);
        }

        function buildWidgetCard(widget, widgetIndex, consoleLayout) {
            if (widget && widget.spacer) {
                var spacer = document.createElement("div");
                spacer.className = "console-widget console-widget-spacer console-widget-spacer-view";
                spacer.setAttribute("aria-hidden", "true");
                spacer.hidden = true;
                return spacer;
            }
            var card = document.createElement("article");
            card.className = "console-widget" + (widget && widget.fullWidth ? " console-widget--full-width" : "");
            var header = document.createElement("div");
            header.className = "console-widget-header";
            if (widgetShowsTitle(widget)) {
                var title = document.createElement("h3");
                title.className = "console-widget-title";
                title.textContent = widget.title || "Widget";
                header.appendChild(title);
            }
            if (widget.showGroupOnOff) {
                var groupWrap = document.createElement("div");
                groupWrap.className = "console-widget-group";
                var groupLabel = document.createElement("span");
                groupLabel.className = "console-widget-group-label";
                groupLabel.textContent = "All";
                var groupSwitch = document.createElement("button");
                groupSwitch.type = "button";
                groupSwitch.className = "console-switch" + (widgetGroupOnOffState(widget) ? " is-on" : "");
                groupSwitch.setAttribute("aria-label", "Group on off");
                groupSwitch.onclick = (function (storedWidget) {
                    return function () {
                        toggleGroupOnOff(storedWidget);
                    };
                })(widget);
                groupWrap.appendChild(groupLabel);
                groupWrap.appendChild(groupSwitch);
                header.appendChild(groupWrap);
            }
            if (header.childNodes.length) {
                card.appendChild(header);
            }
            if (widget && widget.viewport === "composite") {
                card.appendChild(buildCompositeBody(widget, {
                    live: true,
                    widgetIndex: widgetIndex,
                    consoleKey: (consoleLayout && (consoleLayout.id || consoleLayout.name)) || ""
                }));
            } else {
                var list = document.createElement("div");
                applyWidgetViewportListClass(list, widget);
                var bindings = widget.devices || [];
                var bindingIndex;
                var userLayoutOpts = widget.viewport === "grid"
                    ? { alignHWithTitle: true }
                    : null;
                for (bindingIndex = 0; bindingIndex < bindings.length; bindingIndex++) {
                    list.appendChild(buildBindingRow(bindings[bindingIndex], userLayoutOpts));
                }
                card.appendChild(list);
            }
            return card;
        }

        function consoleCmToPx(cmValue) {
            return (Number(cmValue) || 0) * (96 / 2.54);
        }

        function ensureCompositeRows(widget) {
            if (!widget.compositeRows || !Array.isArray(widget.compositeRows)) {
                widget.compositeRows = [];
            }
            return widget.compositeRows;
        }

        function makeDefaultCompositeCell() {
            return {
                width: 1,
                widthUnit: "u",
                contour: false,
                content: "empty",
                alignH: "center",
                alignV: "center",
                text: "",
                binding: null
            };
        }

        function normalizeCompositeAlignH(value) {
            if (value === "left" || value === "right") {
                return value;
            }
            return "center";
        }

        function normalizeCompositeAlignV(value) {
            if (value === "top" || value === "bottom") {
                return value;
            }
            return "center";
        }

        function applyCompositeCellAlignClasses(bodyEl, cell) {
            if (!bodyEl) {
                return;
            }
            var alignH = normalizeCompositeAlignH(cell && cell.alignH);
            var alignV = normalizeCompositeAlignV(cell && cell.alignV);
            bodyEl.classList.remove(
                "console-composite-cell-body--align-h-left",
                "console-composite-cell-body--align-h-center",
                "console-composite-cell-body--align-h-right",
                "console-composite-cell-body--align-v-top",
                "console-composite-cell-body--align-v-center",
                "console-composite-cell-body--align-v-bottom"
            );
            bodyEl.classList.add("console-composite-cell-body--align-h-" + alignH);
            bodyEl.classList.add("console-composite-cell-body--align-v-" + alignV);
        }

        function makeDefaultCompositeRow() {
            return {
                height: 0.1,
                heightUnit: "u",
                cells: [makeDefaultCompositeCell()]
            };
        }

        function widgetDeviceBindings(widget) {
            if (!widget) {
                return [];
            }
            if ((widget.viewport || "vertical") === "composite") {
                var devices = [];
                var rows = widget.compositeRows || [];
                var rowIndex;
                for (rowIndex = 0; rowIndex < rows.length; rowIndex++) {
                    var cells = (rows[rowIndex] && rows[rowIndex].cells) || [];
                    var cellIndex;
                    for (cellIndex = 0; cellIndex < cells.length; cellIndex++) {
                        var cell = cells[cellIndex];
                        if (cell && cell.content === "device" && cell.binding) {
                            devices.push(cell.binding);
                        }
                    }
                }
                return devices;
            }
            return widget.devices || [];
        }

        function applyCompositeLayoutSizes(root, widget) {
            if (!root || !widget) {
                return;
            }
            var isEdit = root.classList.contains("console-composite--edit");
            var rowNodes = root.querySelectorAll(".console-composite-row");
            var rows = widget.compositeRows || [];
            var rowIndex;
            for (rowIndex = 0; rowIndex < rowNodes.length && rowIndex < rows.length; rowIndex++) {
                var row = rows[rowIndex];
                var cells = row.cells || [];
                var rowEl = rowNodes[rowIndex];
                var cellsWrap = rowEl.querySelector(".console-composite-cells");
                var availableWidthPx = cellsWrap
                    ? (cellsWrap.clientWidth || cellsWrap.offsetWidth || 0)
                    : 0;
                if (!(availableWidthPx > 0)) {
                    availableWidthPx = root.clientWidth || root.offsetWidth || 0;
                }
                if (!(availableWidthPx > 0)) {
                    availableWidthPx = consoleCmToPx(10);
                }
                var sumCm = 0;
                var sumU = 0;
                var cellIndex;
                for (cellIndex = 0; cellIndex < cells.length; cellIndex++) {
                    var cell = cells[cellIndex];
                    var widthValue = Number(cell.width);
                    if (!(widthValue > 0)) {
                        widthValue = 1;
                    }
                    if (cell.widthUnit === "cm") {
                        sumCm += consoleCmToPx(widthValue);
                    } else {
                        sumU += widthValue;
                    }
                }
                var cellCols = rowNodes[rowIndex].querySelectorAll(".console-composite-cell-col");
                var cellCount = Math.min(cellCols.length, cells.length);
                var gapPx = 8;
                if (cellsWrap) {
                    var gapStyle = window.getComputedStyle(cellsWrap);
                    var parsedGap = parseFloat(gapStyle.columnGap || gapStyle.gap || "");
                    if (parsedGap > 0) {
                        gapPx = parsedGap;
                    }
                }
                var gapsTotal = cellCount > 1 ? gapPx * (cellCount - 1) : 0;
                var edgeSafetyPx = 2;
                var fitBudget = Math.max(32, availableWidthPx - gapsTotal - edgeSafetyPx);
                var unitPx = sumU > 0 ? (fitBudget - sumCm) / sumU : 0;
                if (!(unitPx > 0)) {
                    unitPx = Math.max(8, fitBudget * 0.05);
                }
                var heightValue = Number(row.height);
                if (!(heightValue > 0)) {
                    heightValue = isEdit ? 0.1 : 1;
                }
                var rowHeightPx = row.heightUnit === "cm"
                    ? consoleCmToPx(heightValue)
                    : unitPx * heightValue;
                var minRowPx = isEdit ? 2 : 16;
                var specifiedHeightPx = Math.max(minRowPx, rowHeightPx);
                var bodyNodes = rowNodes[rowIndex].querySelectorAll(".console-composite-cell-body");
                if (bodyNodes.length) {
                    for (cellIndex = 0; cellIndex < bodyNodes.length; cellIndex++) {
                        if (isEdit) {
                            bodyNodes[cellIndex].style.minHeight = String(specifiedHeightPx) + "px";
                            bodyNodes[cellIndex].style.height = "auto";
                        } else {
                            bodyNodes[cellIndex].style.height = String(specifiedHeightPx) + "px";
                            bodyNodes[cellIndex].style.minHeight = String(specifiedHeightPx) + "px";
                        }
                    }
                } else if (isEdit) {
                    rowNodes[rowIndex].style.minHeight = String(specifiedHeightPx) + "px";
                    rowNodes[rowIndex].style.height = "auto";
                } else {
                    rowNodes[rowIndex].style.height = String(specifiedHeightPx) + "px";
                }
                var finalWidths = [];
                var totalProp = 0;
                for (cellIndex = 0; cellIndex < cellCount; cellIndex++) {
                    var sizedCell = cells[cellIndex];
                    var sizedWidth = Number(sizedCell.width);
                    if (!(sizedWidth > 0)) {
                        sizedWidth = 1;
                    }
                    var widthPx = sizedCell.widthUnit === "cm"
                        ? consoleCmToPx(sizedWidth)
                        : unitPx * sizedWidth;
                    var applied = Math.max(isEdit ? 2 : 16, widthPx);
                    finalWidths.push(applied);
                    totalProp += applied;
                }
                if (cellCount > 0 && totalProp > fitBudget + 0.5) {
                    var scale = fitBudget / totalProp;
                    for (cellIndex = 0; cellIndex < finalWidths.length; cellIndex++) {
                        finalWidths[cellIndex] = finalWidths[cellIndex] * scale;
                    }
                }
                for (cellIndex = 0; cellIndex < cellCount; cellIndex++) {
                    var appliedWidth = String(Math.max(2, finalWidths[cellIndex])) + "px";
                    cellCols[cellIndex].style.width = appliedWidth;
                    cellCols[cellIndex].style.maxWidth = appliedWidth;
                    cellCols[cellIndex].style.minWidth = "0";
                    cellCols[cellIndex].style.flex = "0 0 auto";
                }
            }
            applyCompositeContentFit(root);
        }

        function applyCompositeContentFit(root) {
            if (!root) {
                return;
            }
            // Option B: proportional arc digits + labels with min/max clamp.
            // Labels always stay smaller than digits. Keep identical in index.html and user.html.
            var GAUGE_ASPECT = 104 / 58;
            var TITLE_FONT_MAX = 15;
            var TITLE_FONT_MIN = 9;
            var VALUE_FONT_BASE = 12;
            var VALUE_FONT_MIN = 10;
            var VALUE_FONT_MAX = 16;
            var VALUE_FONT_REF = 104;
            var TITLE_GAP = 4;
            var TITLE_TO_VALUE_RATIO = 0.9;

            function measureBodyFit(bodyEl) {
                var cellW = bodyEl.clientWidth || bodyEl.offsetWidth || 0;
                var cellH = bodyEl.clientHeight || bodyEl.offsetHeight || 0;
                return {
                    fitW: Math.max(24, cellW - 4),
                    fitH: Math.max(24, cellH - 4)
                };
            }

            function titleIsVisible(titleEl) {
                return !!(titleEl
                    && titleEl.offsetParent !== null
                    && window.getComputedStyle(titleEl).display !== "none");
            }

            function fitTitleFont(titleEl, maxWidthPx, maxHeightPx, targetFontPx) {
                if (!titleEl || !(maxWidthPx > 0) || !(maxHeightPx > 0)) {
                    return 0;
                }
                titleEl.style.width = "100%";
                titleEl.style.maxWidth = String(maxWidthPx) + "px";
                titleEl.style.boxSizing = "border-box";
                titleEl.style.whiteSpace = "normal";
                titleEl.style.overflowWrap = "anywhere";
                titleEl.style.lineHeight = "1.15";
                titleEl.style.minHeight = "";
                var fontPx = Math.max(TITLE_FONT_MIN, Math.min(TITLE_FONT_MAX, targetFontPx));
                titleEl.style.fontSize = String(fontPx) + "px";
                while (fontPx > TITLE_FONT_MIN
                    && (titleEl.scrollHeight > maxHeightPx + 0.5
                        || titleEl.scrollWidth > maxWidthPx + 0.5)) {
                    fontPx -= 0.5;
                    titleEl.style.fontSize = String(fontPx) + "px";
                }
                return Math.min(maxHeightPx, titleEl.offsetHeight || 0);
            }

            var rowNodes = root.querySelectorAll(".console-composite-row");
            var rowIndex;
            for (rowIndex = 0; rowIndex < rowNodes.length; rowIndex++) {
                var rowEl = rowNodes[rowIndex];
                var bodyNodes = rowEl.querySelectorAll(".console-composite-cell-body");
                var gaugeBodies = [];
                var bodyIndex;
                for (bodyIndex = 0; bodyIndex < bodyNodes.length; bodyIndex++) {
                    var bodyEl = bodyNodes[bodyIndex];
                    var fit = measureBodyFit(bodyEl);
                    bodyEl.style.setProperty("--composite-cell-w", String(fit.fitW) + "px");
                    bodyEl.style.setProperty("--composite-cell-h", String(fit.fitH) + "px");
                    // Scene pins keep editor proportions — do not scale gauges to the full scene cell.
                    if (bodyEl.querySelector(".console-gauge-arc-svg")
                        && !bodyEl.querySelector(".scene-cell, .scene-cell-host")) {
                        gaugeBodies.push({ bodyEl: bodyEl, fitW: fit.fitW, fitH: fit.fitH });
                    }
                    var scenePinGauges = bodyEl.querySelectorAll(
                        ".scene-cell-pin .console-gauge-arc-svg, .scene-bind-pin .console-gauge-arc-svg"
                    );
                    var pinGaugeIndex;
                    for (pinGaugeIndex = 0; pinGaugeIndex < scenePinGauges.length; pinGaugeIndex++) {
                        scenePinGauges[pinGaugeIndex].style.width = "";
                        scenePinGauges[pinGaugeIndex].style.maxWidth = "";
                        scenePinGauges[pinGaugeIndex].style.height = "";
                        var pinValues = scenePinGauges[pinGaugeIndex]
                            .querySelectorAll(".console-gauge-value-svg");
                        var pinValueIndex;
                        for (pinValueIndex = 0; pinValueIndex < pinValues.length; pinValueIndex++) {
                            pinValues[pinValueIndex].style.fontSize = "";
                        }
                    }
                    var icons = bodyEl.querySelectorAll(".console-binary-icon");
                    var iconIndex;
                    // Fit-to-cell base (scale=1), then multiply by binding Icon scale.
                    var iconFit = Math.max(16, Math.min(fit.fitW, fit.fitH) * 0.7);
                    var fitBaseScale = Math.max(0.5, Math.min(4, iconFit / 32));
                    for (iconIndex = 0; iconIndex < icons.length; iconIndex++) {
                        var iconNode = icons[iconIndex];
                        var bindingScaleNode = iconNode.closest
                            ? iconNode.closest("[data-binding-scale]")
                            : null;
                        var bindingScale = normalizeIconScale(
                            bindingScaleNode
                                ? bindingScaleNode.getAttribute("data-binding-scale")
                                : 1
                        );
                        // Scene pins: outline sizeW/sizeH only — do not apply Icon scale.
                        if (iconNode.closest && iconNode.closest(".scene-cell-pin, .scene-bind-pin")) {
                            iconNode.style.minWidth = "0";
                            iconNode.style.minHeight = "0";
                            iconNode.style.maxWidth = "";
                            iconNode.style.maxHeight = "";
                            iconNode.style.width = "100%";
                            iconNode.style.height = "100%";
                            var pinGlyph = iconNode.querySelector(".mdi");
                            if (pinGlyph) {
                                pinGlyph.style.transform = "";
                            }
                            continue;
                        }
                        (function (iconWrap, maxW, maxH, fitBase, bindScale) {
                            var combined = fitBase * bindScale;
                            iconWrap.style.setProperty("--console-icon-scale", String(combined));
                            iconWrap.style.minWidth = "0";
                            iconWrap.style.minHeight = "0";
                            iconWrap.style.maxWidth = "none";
                            iconWrap.style.maxHeight = "none";
                            var glyph = iconWrap.querySelector(".mdi");
                            if (glyph) {
                                glyph.style.transformOrigin = "center center";
                                glyph.style.transform = "";
                            }
                            window.requestAnimationFrame(function () {
                                var target = iconWrap.querySelector(".mdi") || iconWrap;
                                var glyphW = target.scrollWidth || target.offsetWidth || 0;
                                var glyphH = target.scrollHeight || target.offsetHeight || 0;
                                if (!(glyphW > 0 && glyphH > 0)) {
                                    return;
                                }
                                // Soft MDI em-box trim against scale-relative allowance so
                                // Icon scale is not cancelled by a hard cell clamp.
                                var allowW = maxW * 0.85 * bindScale;
                                var allowH = maxH * 0.85 * bindScale;
                                var overflowFit = Math.min(1, allowW / glyphW, allowH / glyphH);
                                target.style.transformOrigin = "center center";
                                target.style.transform = overflowFit < 0.999
                                    ? ("scale(" + String(overflowFit) + ")")
                                    : "";
                            });
                        })(iconNode, fit.fitW, fit.fitH, fitBaseScale, bindingScale);
                    }
                }
                var gIndex;
                for (gIndex = 0; gIndex < gaugeBodies.length; gIndex++) {
                    var gaugeBody = gaugeBodies[gIndex];
                    var titleEl = gaugeBody.bodyEl.querySelector(".console-device-row-title");
                    var hasTitle = titleIsVisible(titleEl);
                    var gaugeScaleNode = gaugeBody.bodyEl.querySelector("[data-binding-scale]")
                        || gaugeBody.bodyEl;
                    var gaugeBindingScale = normalizeIconScale(
                        gaugeScaleNode.getAttribute
                            ? gaugeScaleNode.getAttribute("data-binding-scale")
                            : 1
                    );
                    var provisionalTitleBand = hasTitle
                        ? Math.max(
                            TITLE_FONT_MIN * 1.15,
                            Math.min(gaugeBody.fitH * 0.22, TITLE_FONT_MAX * 1.15 * 2 + 2)
                        )
                        : 0;
                    var availH = Math.max(28, gaugeBody.fitH - provisionalTitleBand - TITLE_GAP);
                    var gaugeSize = Math.max(36, Math.min(gaugeBody.fitW, availH * GAUGE_ASPECT))
                        * gaugeBindingScale;
                    var valueFont = Math.max(
                        VALUE_FONT_MIN,
                        Math.min(VALUE_FONT_MAX, VALUE_FONT_BASE * (gaugeSize / VALUE_FONT_REF))
                    );
                    var titleBand = 0;
                    if (hasTitle) {
                        var titleFont = Math.min(
                            TITLE_FONT_MAX,
                            Math.max(TITLE_FONT_MIN, valueFont * TITLE_TO_VALUE_RATIO)
                        );
                        if (titleFont >= valueFont - 0.5) {
                            titleFont = Math.max(TITLE_FONT_MIN, valueFont - 2);
                        }
                        titleBand = fitTitleFont(
                            titleEl,
                            gaugeBody.fitW,
                            Math.max(provisionalTitleBand, titleFont * 1.15 * 2 + 2),
                            titleFont
                        );
                        titleEl.style.minHeight = "";
                        // Re-fit gauge with the real title height so digits stay larger than labels.
                        availH = Math.max(28, gaugeBody.fitH - titleBand - TITLE_GAP);
                        gaugeSize = Math.max(36, Math.min(gaugeBody.fitW, availH * GAUGE_ASPECT))
                            * gaugeBindingScale;
                        valueFont = Math.max(
                            VALUE_FONT_MIN,
                            Math.min(VALUE_FONT_MAX, VALUE_FONT_BASE * (gaugeSize / VALUE_FONT_REF))
                        );
                        if (parseFloat(titleEl.style.fontSize) >= valueFont - 0.5) {
                            titleFont = Math.max(TITLE_FONT_MIN, valueFont - 2);
                            titleBand = fitTitleFont(
                                titleEl,
                                gaugeBody.fitW,
                                Math.max(titleBand, titleFont * 1.15 * 2 + 2),
                                titleFont
                            );
                        }
                    }
                    var gaugeSvgs = gaugeBody.bodyEl.querySelectorAll(".console-gauge-arc-svg");
                    var svgIndex;
                    for (svgIndex = 0; svgIndex < gaugeSvgs.length; svgIndex++) {
                        if (gaugeSvgs[svgIndex].closest
                            && gaugeSvgs[svgIndex].closest(".scene-cell-pin, .scene-bind-pin")) {
                            continue;
                        }
                        gaugeSvgs[svgIndex].style.width = String(gaugeSize) + "px";
                        gaugeSvgs[svgIndex].style.maxWidth = "100%";
                        gaugeSvgs[svgIndex].style.height = "auto";
                        var valueNodes = gaugeSvgs[svgIndex].querySelectorAll(".console-gauge-value-svg");
                        var valueIndex;
                        for (valueIndex = 0; valueIndex < valueNodes.length; valueIndex++) {
                            valueNodes[valueIndex].style.fontSize = String(valueFont) + "px";
                        }
                    }
                }
            }
        }

        function bindCompositeResize(root, widget) {
            if (!root) {
                return;
            }
            root.__compositeWidget = widget || null;
            if (typeof ResizeObserver === "undefined") {
                return;
            }
            if (root.__compositeRo) {
                root.__compositeRo.disconnect();
            }
            root.__compositeRo = new ResizeObserver(function () {
                var stored = root.__compositeWidget;
                if (stored) {
                    applyCompositeLayoutSizes(root, stored);
                }
            });
            root.__compositeRo.observe(root);
        }

        function refreshAllCompositeLayouts() {
            var roots = document.querySelectorAll(".console-composite");
            var rootIndex;
            for (rootIndex = 0; rootIndex < roots.length; rootIndex++) {
                var root = roots[rootIndex];
                if (root.__compositeWidget) {
                    applyCompositeLayoutSizes(root, root.__compositeWidget);
                }
            }
        }

        if (!window.__consoleCompositeResizeBound) {
            window.__consoleCompositeResizeBound = true;
            window.addEventListener("resize", refreshAllCompositeLayouts);
        }

        function syncCompositeSizesFromDomAndApply(root) {
            if (!root) {
                return;
            }
            /* edit-only sizing sync; unused on user page */
        }

        var consoleCameraMediaCache = {};
        var consoleCameraLiveViewCache = {};
        var CONSOLE_CAMERA_REFRESH_MS = 3000;

        function consoleCameraFetchMedia(cameraId) {
            if (!cameraId) {
                return Promise.resolve(null);
            }
            if (!consoleCameraMediaCache[cameraId]) {
                consoleCameraMediaCache[cameraId] = fetch(
                    "/api/cameras/media?id=" + encodeURIComponent(cameraId),
                    { cache: "no-store" }
                ).then(function (response) {
                    if (!response.ok) {
                        return null;
                    }
                    return response.json();
                }).catch(function () {
                    return null;
                });
            }
            return consoleCameraMediaCache[cameraId];
        }

        function consoleCameraUrlWithCacheBuster(url) {
            return url + (url.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();
        }

        function consoleCameraStaggerMs(cacheKey) {
            var hash = 0;
            var text = String(cacheKey || "");
            var index;
            for (index = 0; index < text.length; index++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(index);
                hash |= 0;
            }
            return Math.abs(hash) % CONSOLE_CAMERA_REFRESH_MS;
        }

        function consoleCameraSwapJpeg(host) {
            var url = host && host._cameraSnapshotUrl;
            var front = host && host._cameraFrontImg;
            var back = host && host._cameraBackImg;
            if (!url || !front || !back) {
                return;
            }
            var generation = (host._cameraJpegGeneration || 0) + 1;
            host._cameraJpegGeneration = generation;
            var bustedUrl = consoleCameraUrlWithCacheBuster(url);
            back.onload = function () {
                if (!host.isConnected || host._cameraJpegGeneration !== generation) {
                    return;
                }
                back.classList.add("is-front");
                back.classList.remove("is-back");
                front.classList.add("is-back");
                front.classList.remove("is-front");
                host._cameraFrontImg = back;
                host._cameraBackImg = front;
            };
            back.onerror = function () {
                /* Keep the front frame visible. */
            };
            back.src = bustedUrl;
        }

        function consoleCameraArmJpegRefresh(host) {
            if (!host || !host._cameraSnapshotUrl || host._cameraJpegArmed) {
                return;
            }
            host._cameraJpegArmed = true;
            function tick() {
                host._cameraJpegTimer = null;
                if (!host.isConnected) {
                    host._cameraJpegArmed = false;
                    return;
                }
                consoleCameraSwapJpeg(host);
                host._cameraJpegTimer = window.setTimeout(tick, CONSOLE_CAMERA_REFRESH_MS);
            }
            var delay = host._cameraJpegInitialDelay != null
                ? host._cameraJpegInitialDelay
                : CONSOLE_CAMERA_REFRESH_MS;
            host._cameraJpegInitialDelay = CONSOLE_CAMERA_REFRESH_MS;
            host._cameraJpegTimer = window.setTimeout(tick, delay);
        }

        function buildConsoleCameraView(cell, liveCacheKey) {
            var cameraId = cell && cell.cameraId ? String(cell.cameraId) : "";
            var mode = cell && cell.cameraMode === "live" ? "live" : "jpegRefresh";
            var channelIndex = cell && Number(cell.cameraChannel) === 2 ? 1 : 0;
            var bindingKey = cameraId + "|" + mode + "|" + channelIndex;
            if (liveCacheKey) {
                var cachedHost = consoleCameraLiveViewCache[liveCacheKey];
                if (cachedHost && cachedHost._cameraBindingKey === bindingKey) {
                    consoleCameraArmJpegRefresh(cachedHost);
                    return cachedHost;
                }
            }
            var host = document.createElement("div");
            host.className = "console-camera-view";
            host._cameraBindingKey = bindingKey;
            if (liveCacheKey) {
                consoleCameraLiveViewCache[liveCacheKey] = host;
            }
            function showUnavailable() {
                host.classList.remove("is-jpeg-stack");
                host.innerHTML = "";
                host._cameraSnapshotUrl = "";
                host._cameraFrontImg = null;
                host._cameraBackImg = null;
                var note = document.createElement("div");
                note.className = "console-camera-placeholder";
                note.textContent = "Camera unavailable";
                host.appendChild(note);
            }
            if (!cameraId) {
                showUnavailable();
                return host;
            }
            consoleCameraFetchMedia(cameraId).then(function (media) {
                if (liveCacheKey && consoleCameraLiveViewCache[liveCacheKey] !== host) {
                    return;
                }

        function buildConsoleGaugeElement(binding, numericValue, displayText) {
            var gauge = binding && binding.gauge ? binding.gauge : {};
            var minValue = gauge.min != null ? Number(gauge.min) : 0;
            var maxValue = gauge.max != null ? Number(gauge.max) : 100;
            if (!(maxValue > minValue)) {
                maxValue = minValue + 1;
            }
            var clamped = numericValue;
            if (isNaN(clamped)) {
                clamped = minValue;
            } else if (clamped < minValue) {
                clamped = minValue;
            } else if (clamped > maxValue) {
                clamped = maxValue;
            }
            var ratio = (clamped - minValue) / (maxValue - minValue);
            var ranges = Array.isArray(gauge.ranges) ? gauge.ranges.slice() : [];
            ranges.sort(function (left, right) {
                return Number(left.top) - Number(right.top);
            });
            var wrap = document.createElement("div");
            var linearStyle = normalizeLinearStyle(gauge.linearStyle);
            var isVertical = linearStyle === "vertical" || linearStyle === "verticalFilled";
            var isFilled = linearStyle === "filled" || linearStyle === "verticalFilled";
            wrap.className = "console-gauge console-gauge--" + (gauge.type === "linear" ? "linear" : "arc")
                + (isVertical ? " console-gauge--vertical" : "")
                + (isFilled ? " console-gauge--filled" : "");
            if (gauge.type === "linear") {
                if (isFilled) {
                    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("class", "console-gauge-linear-svg");
                    var stroke = 14;
                    var trackLen = 100;
                    if (isVertical) {
                        svg.setAttribute("viewBox", "-12 0 24 104");
                        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
                        function appendLinearSeg(fromPct, toPct, color) {
                            if (!(toPct > fromPct + 0.001)) {
                                return;
                            }
                            var y1 = trackLen - fromPct * trackLen;
                            var y2 = trackLen - toPct * trackLen;
                            var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                            path.setAttribute("d", "M 0 " + y1 + " L 0 " + y2);
                            path.setAttribute("fill", "none");
                            path.setAttribute("stroke", color);
                            path.setAttribute("stroke-width", String(stroke));
                            path.setAttribute("stroke-linecap", "butt");
                            svg.appendChild(path);
                        }
                        appendLinearSeg(0, 1, "#334155");
                        var previous = minValue;
                        var colorIndex;
                        for (colorIndex = 0; colorIndex < ranges.length; colorIndex++) {
                            var top = Number(ranges[colorIndex].top);
                            if (!(top > previous)) {
                                continue;
                            }
                            appendLinearSeg(
                                (previous - minValue) / (maxValue - minValue),
                                (Math.min(top, maxValue) - minValue) / (maxValue - minValue),
                                ranges[colorIndex].color || "#3b82f6"
                            );
                            previous = top;
                        }
                        if (!ranges.length) {
                            appendLinearSeg(0, ratio, "#3b82f6");
                        }
                        var arrowY = trackLen - ratio * trackLen;
                        var arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        arrow.setAttribute(
                            "d",
                            "M -11," + (arrowY - 3.2) + " L 11," + arrowY
                                + " L -11," + (arrowY + 3.2) + " Z"
                        );
                        arrow.setAttribute("fill", "currentColor");
                        svg.appendChild(arrow);
                    } else {
                        svg.setAttribute("viewBox", "0 -12 104 24");
                        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
                        function appendLinearSegH(fromPct, toPct, color) {
                            if (!(toPct > fromPct + 0.001)) {
                                return;
                            }
                            var x1 = fromPct * trackLen;
                            var x2 = toPct * trackLen;
                            var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                            path.setAttribute("d", "M " + x1 + " 0 L " + x2 + " 0");
                            path.setAttribute("fill", "none");
                            path.setAttribute("stroke", color);
                            path.setAttribute("stroke-width", String(stroke));
                            path.setAttribute("stroke-linecap", "butt");
                            svg.appendChild(path);
                        }
                        appendLinearSegH(0, 1, "#334155");
                        var previousH = minValue;
                        var colorIndexH;
                        for (colorIndexH = 0; colorIndexH < ranges.length; colorIndexH++) {
                            var topH = Number(ranges[colorIndexH].top);
                            if (!(topH > previousH)) {
                                continue;
                            }
                            appendLinearSegH(
                                (previousH - minValue) / (maxValue - minValue),
                                (Math.min(topH, maxValue) - minValue) / (maxValue - minValue),
                                ranges[colorIndexH].color || "#3b82f6"
                            );
                            previousH = topH;
                        }
                        if (!ranges.length) {
                            appendLinearSegH(0, ratio, "#3b82f6");
                        }
                        var arrowX = ratio * trackLen;
                        var arrowH = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        arrowH.setAttribute(
                            "d",
                            "M " + (arrowX - 3.2) + ",-11 L " + arrowX + ",11 L "
                                + (arrowX + 3.2) + ",-11 Z"
                        );
                        arrowH.setAttribute("fill", "currentColor");
                        svg.appendChild(arrowH);
                    }
                    wrap.appendChild(svg);
                } else {
                    var track = document.createElement("div");
                    track.className = "console-gauge-linear-track";
                    var fill = document.createElement("div");
                    fill.className = "console-gauge-linear-fill";
                    if (isVertical) {
                        fill.style.height = String(Math.round(ratio * 1000) / 10) + "%";
                        fill.style.width = "100%";
                        track.style.display = "flex";
                        track.style.flexDirection = "column-reverse";
                    } else {
                        fill.style.width = String(Math.round(ratio * 1000) / 10) + "%";
                    }
                    var fillColor = "#3b82f6";
                    var rangeIndex;
                    for (rangeIndex = 0; rangeIndex < ranges.length; rangeIndex++) {
                        if (clamped <= Number(ranges[rangeIndex].top)) {
                            fillColor = ranges[rangeIndex].color || fillColor;
                            break;
                        }
                    }
                    fill.style.background = fillColor;
                    track.appendChild(fill);

            } else {
